# OPS-01: Prometheus 告警规则（ADR-0006 §2, v0.5 §6.6）
#
# SLO 定义：
#   - HTTP 可用性：99.5% (允许 0.5% 错误率)
#   - HTTP p95 延迟：1 秒
#   - Job 完成率：99% (1% 死信可接受)
#   - 最老 pending job：5 分钟
#   - Provider 错误率：< 5%
#   - 备份新鲜度：24 小时内
#
# 告警级别：
#   - warning：需要关注但非紧急
#   - critical：需要立即响应
#
# 所有规则使用 `ailearn_` 前缀，避免与其他服务冲突。

groups:
  # ─── HTTP 服务健康 ───────────────────────────────────────────────────────
  - name: ailearn_http_health
    interval: 30s
    rules:
      # API 不可用（/readiness 返回 0）
      - alert: AILearnAPIDown
        expr: |
          (up{job="ailearn-api"} == 0)
          or absent(up{job="ailearn-api"})
          or (ailearn_readiness_status{job="ailearn-api"} == 0)
          or absent(ailearn_readiness_status{job="ailearn-api"})
        for: 1m
        labels:
          severity: critical
          team: platform
        annotations:
          summary: "AI Learn API 服务不可用"
          description: "API readiness 状态为 0，服务可能已停止或崩溃。"
          runbook: "docs/operations.md#alerts"

      - alert: AILearnWorkerDown
        expr: |
          (up{job="ailearn-worker"} == 0)
          or absent(up{job="ailearn-worker"})
        for: 1m
        labels:
          severity: critical
          team: platform
        annotations:
          summary: "AI Learn Worker 服务不可用"
          description: "Prometheus 无法抓取 Worker 指标端点。"
          runbook: "docs/operations.md#alerts"

      # HTTP 5xx 错误率过高（超过 0.5%）
      - alert: AILearnHighHTTP5xxRate
        expr: |
          (
            rate(ailearn_http_errors_5xx_total[5m])
            /
            rate(ailearn_http_requests_total[5m])
          ) > 0.005
        for: 5m
        labels:
          severity: warning
          team: platform
        annotations:
          summary: "HTTP 5xx 错误率过高"
          description: "5xx 错误率达到 {{ $value | humanizePercentage }}，超过 SLO 目标 0.5%。"
          runbook: "docs/operations.md#alerts"

      # HTTP p95 延迟超过 1 秒
      - alert: AILearnHighHTTPLatency
        expr: |
          histogram_quantile(0.95, rate(ailearn_http_request_duration_seconds_bucket[5m])) > 1
        for: 5m
        labels:
          severity: warning
          team: platform
        annotations:
          summary: "HTTP p95 延迟超过阈值"
          description: "p95 延迟达到 {{ $value }}s，超过 SLO 目标 1s。"
          runbook: "docs/operations.md#alerts"

  # ─── Job 队列健康 ─────────────────────────────────────────────────────────
  - name: ailearn_job_health
    interval: 30s
    rules:
      # Pending 队列堆积超过 100
      - alert: AILearnJobQueueBacklog
        expr: ailearn_job_queue_depth{status="pending"} > 100
        for: 5m
        labels:
          severity: warning
          team: platform
        annotations:
          summary: "Job 队列堆积"
          description: "Pending 队列深度达到 {{ $value }}，可能 Worker 处理速度不足。"
          runbook: "docs/operations.md#alerts"

      # 最老 pending job 超过 5 分钟
      - alert: AILearnStalePendingJob
        expr: ailearn_job_oldest_pending_age_seconds > 300
        for: 2m
        labels:
          severity: critical
          team: platform
        annotations:
          summary: "存在超时 pending job"
          description: "最老的 pending job 已等待 {{ $value | humanizeDuration }}，超过阈值 5 分钟。"
          runbook: "docs/operations.md#alerts"

      # Job 死信率超过 1%
      - alert: AILearnHighJobDeadRate
        expr: |
          (
            rate(ailearn_job_terminal_total{status="dead"}[10m])
            /
            rate(ailearn_job_terminal_total[10m])
          ) > 0.01
        for: 10m
        labels:
          severity: warning
          team: platform
        annotations:
          summary: "Job 死信率过高"
          description: "死信率达到 {{ $value | humanizePercentage }}，超过 SLO 目标 1%。"
          runbook: "docs/operations.md#alerts"

      # Job lease 丢失
      - alert: AILearnJobLeaseLost
        expr: rate(ailearn_job_lease_lost_total[5m]) > 0
        for: 1m
        labels:
          severity: warning
          team: platform
        annotations:
          summary: "检测到 job lease 丢失"
          description: "过去 5 分钟内发生 {{ $value }} 次 lease 丢失事件。"
          runbook: "docs/operations.md#alerts"

  # ─── Provider 调用健康 ─────────────────────────────────────────────────────
  - name: ailearn_provider_health
    interval: 30s
    rules:
      # Provider 错误率超过 5%
      - alert: AILearnHighProviderErrorRate
        expr: |
          (
            rate(ailearn_provider_errors_total[5m])
            /
            rate(ailearn_provider_calls_total[5m])
          ) > 0.05
        for: 5m
        labels:
          severity: warning
          team: platform
        annotations:
          summary: "AI Provider 错误率过高"
          description: "Provider 错误率达到 {{ $value | humanizePercentage }}，超过阈值 5%。"
          runbook: "docs/operations.md#alerts"

      # Provider 调用超时（p95 超过 30 秒）
      - alert: AILearnProviderHighLatency
        expr: |
          histogram_quantile(0.95, rate(ailearn_provider_call_duration_seconds_bucket[5m])) > 30
        for: 5m
        labels:
          severity: warning
          team: platform
        annotations:
          summary: "Provider 调用延迟过高"
          description: "Provider 调用 p95 延迟达到 {{ $value }}s，超过阈值 30s。"
          runbook: "docs/operations.md#alerts"

      # Provider schema failure（结构化错误）
      - alert: AILearnProviderSchemaFailure
        expr: rate(ailearn_provider_errors_total{error_category="schema_failure"}[5m]) > 0
        for: 2m
        labels:
          severity: warning
          team: platform
        annotations:
          summary: "Provider 返回结构化错误"
          description: "检测到 schema_failure 错误，可能模型输出格式不兼容。"
          runbook: "docs/operations.md#alerts"

      # Provider 配额不足
      - alert: AILearnProviderQuotaExceeded
        expr: rate(ailearn_provider_errors_total{error_category="quota_exceeded"}[5m]) > 0
        for: 1m
        labels:
          severity: critical
          team: platform
        annotations:
          summary: "Provider 配额不足"
          description: "检测到 quota_exceeded 错误，需检查 API key 配额。"
          runbook: "docs/operations.md#alerts"

  # ─── 数据库健康 ───────────────────────────────────────────────────────────
  - name: ailearn_database_health
    interval: 30s
    rules:
      # 数据库事务失败率过高
      - alert: AILearnHighTransactionFailureRate
        expr: rate(ailearn_db_transaction_failures_total[5m]) > 1
        for: 5m
        labels:
          severity: warning
          team: platform
        annotations:
          summary: "数据库事务失败率过高"
          description: "事务失败速率达到 {{ $value }}/s。"
          runbook: "docs/operations.md#alerts"

      # RLS 拒绝率激增（可能表明 policy 配置问题或异常访问模式）
      - alert: AILearnHighRLSDenialRate
        expr: rate(ailearn_db_rls_denied_total[5m]) > 10
        for: 5m
        labels:
          severity: warning
          team: platform
        annotations:
          summary: "RLS 拒绝率激增"
          description: "RLS policy 拒绝速率达到 {{ $value }}/s，需检查是否有异常访问模式。"
          runbook: "docs/operations.md#alerts"

      # 备份过期（超过 24 小时无成功备份）
      - alert: AILearnBackupStale
        expr: |
          (up{job="ailearn-backup"} == 0)
          or absent(up{job="ailearn-backup"})
          or absent(ailearn_db_last_successful_backup_timestamp{job="ailearn-backup"})
          or ((time() - ailearn_db_last_successful_backup_timestamp{job="ailearn-backup"}) > 86400)
        for: 1m
        labels:
          severity: critical
          team: platform
        annotations:
          summary: "数据库备份过期"
          description: "距离上次成功备份已超过 {{ $value | humanizeDuration }}，超过 SLO 目标 24 小时。"
          runbook: "docs/operations.md#alerts"

  # ─── Alpha 漏斗监控 ─────────────────────────────────────────────────────────
  - name: ailearn_funnel_monitoring
    interval: 60s
    rules:
      # 邀请发出后 1 小时内无人消费（可能邀请流程有问题）
      - alert: AILearnLowInviteConsumptionRate
        expr: |
          (
            rate(ailearn_funnel_events_total{event="invite_consumed"}[1h])
            /
            rate(ailearn_funnel_events_total{event="invite_created"}[1h])
          ) < 0.1
        for: 2h
        labels:
          severity: warning
          team: product
        annotations:
          summary: "邀请消费率过低"
          description: "邀请发出后消费率低于 10%。"
          runbook: "docs/operations.md#alerts"

      # 学习卡生成失败率过高
      - alert: AILearnLowCardGenerationSuccessRate
        expr: |
          (
            rate(ailearn_funnel_events_total{event="card_generation_failed"}[10m])
            /
            rate(ailearn_funnel_events_total{event="card_generation_terminal"}[10m])
          ) > 0.2
        for: 10m
        labels:
          severity: warning
          team: platform
        annotations:
          summary: "学习卡生成失败率过高"
          description: "卡片生成失败率超过 20%。"
          runbook: "docs/operations.md#alerts"

  # ─── Release 信息 ───────────────────────────────────────────────────────────
  - name: ailearn_release_info
    interval: 60s
    rules:
      # 检测到新的部署
      - alert: AILearnReleaseDeployed
        expr: |
          increase(ailearn_funnel_events_total{event="release_deployed"}[5m]) > 0
        for: 1m
        labels:
          severity: info
          team: platform
        annotations:
          summary: "检测到新版本部署"
          description: "新的 release 已部署。"

      # 检测到回滚
      - alert: AILearnReleaseRolledBack
        expr: |
          increase(ailearn_funnel_events_total{event="release_rolled_back"}[5m]) > 0
        for: 1m
        labels:
          severity: critical
          team: platform
        annotations:
          summary: "检测到版本回滚"
          description: "Release 已回滚，需立即调查原因。"
          runbook: "docs/operations.md#rollback"

  # ─── Supervisor Agent v1 健康 ──────────────────────────────────────────────
  #
  # 对应计划 §W7, §17.3, §19.3 的监控要求。
  # 所有指标使用 `ailearn_supervisor_` 前缀。
  # 告警级别：
  #   - warning：需要关注但非紧急
  #   - critical：需要立即响应（hard invariant 违规 = 立即回滚）
  - name: ailearn_supervisor_agent_v1
    interval: 30s
    rules:
      # Supervisor Agent run 失败率超过 2%
      - alert: AILearnSupervisorHighRunFailureRate
        expr: |
          (
            rate(ailearn_supervisor_run_failures_total[10m])
            /
            rate(ailearn_supervisor_run_terminal_total[10m])
          ) > 0.02
        for: 10m
        labels:
          severity: warning
          team: platform
        annotations:
          summary: "Supervisor Agent run 失败率过高"
          description: "失败率达到 {{ $value | humanizePercentage }}，超过阈值 2%。"
          runbook: "docs/runbooks/card-generation-supervisor-v1-rollout-rollback.md"

      # 非 cancel run 成功率低于 98%（计划 §17.3）
      - alert: AILearnSupervisorLowSuccessRate
        expr: |
          (
            rate(ailearn_supervisor_run_failures_total[15m])
            /
            rate(ailearn_supervisor_run_terminal_total[15m])
          ) > 0.02
        for: 15m
        labels:
          severity: warning
          team: platform
        annotations:
          summary: "Supervisor Agent 非 cancel 成功率低于 98%"
          description: "非 cancel run 失败率超过 2%。"
          runbook: "docs/runbooks/card-generation-supervisor-v1-rollout-rollback.md"

      # Critic 拒绝率过高（可能表明生成质量下降）
      - alert: AILearnSupervisorHighCriticRejectionRate
        expr: |
          (
            rate(ailearn_supervisor_critic_rejections_total[15m])
            /
            rate(ailearn_supervisor_critic_evaluations_total[15m])
          ) > 0.30
        for: 15m
        labels:
          severity: warning
          team: platform
        annotations:
          summary: "Supervisor Critic 拒绝率过高"
          description: "Critic 拒绝率达到 {{ $value | humanizePercentage }}，超过停止扩量阈值 30%。"
          runbook: "docs/runbooks/card-generation-supervisor-v1-rollout-rollback.md"

      # Repair 触发率超过 30%（计划 §17.3 停止扩量阈值）
      - alert: AILearnSupervisorHighRepairRate
        expr: |
          (
            rate(ailearn_supervisor_repair_triggered_total[15m])
            /
            rate(ailearn_supervisor_run_terminal_total[15m])
          ) > 0.30
        for: 15m
        labels:
          severity: warning
          team: platform
        annotations:
          summary: "Supervisor Repair 触发率超过停止扩量阈值"
          description: "Repair 触发率达到 {{ $value | humanizePercentage }}，超过 30% 停止扩量阈值。"
          runbook: "docs/runbooks/card-generation-supervisor-v1-rollout-rollback.md"

      # Hard invariant 违规 = 立即回滚（计划 §19.3）
      - alert: AILearnSupervisorHardInvariantViolation
        expr: rate(ailearn_supervisor_hard_invariant_violations_total[1m]) > 0
        for: 0s
        labels:
          severity: critical
          team: platform
        annotations:
          summary: "Supervisor Agent hard invariant 违规"
          description: "检测到 hard invariant 违规，需立即回滚。违规类型包括：evidence/tenant/hash/epoch/idempotency/partial/privacy 违规、unsupported/contradicted claim 发布、child 越权 delegate、Agent direct canonical write、Supervisor 未经 Critic 发布。"
          runbook: "docs/runbooks/card-generation-supervisor-v1-rollout-rollback.md#立即回滚"

      # Evidence integrity 违规
      - alert: AILearnSupervisorEvidenceIntegrityViolation
        expr: rate(ailearn_supervisor_evidence_integrity_violations_total[5m]) > 0
        for: 2m
        labels:
          severity: critical
          team: platform
        annotations:
          summary: "Supervisor evidence integrity 违规"
          description: "检测到 evidence allowlist/quote-hash/typed-evidence 违规。"
          runbook: "docs/runbooks/card-generation-supervisor-v1-rollout-rollback.md"

      # 不支持的 claim 被发布（立即回滚条件）
      - alert: AILearnSupervisorUnsupportedClaimPublished
        expr: rate(ailearn_supervisor_unsupported_claims_published_total[1m]) > 0
        for: 0s
        labels:
          severity: critical
          team: platform
        annotations:
          summary: "Supervisor 发布了不支持的 claim"
          description: "unsupported/contradicted claim 被发布，需立即回滚。"
          runbook: "docs/runbooks/card-generation-supervisor-v1-rollout-rollback.md#立即回滚"

      # 预算超限
      - alert: AILearnSupervisorBudgetExceeded
        expr: rate(ailearn_supervisor_budget_exceeded_total[5m]) > 0
        for: 5m
        labels:
          severity: warning
          team: platform
        annotations:
          summary: "Supervisor Agent 预算超限"
          description: "检测到 turn/token/tool-call/cost 预算超限事件。"
          runbook: "docs/runbooks/card-generation-supervisor-v1-rollout-rollback.md"

      # Coverage 不完整（< 100%）
      - alert: AILearnSupervisorLowCoverage
        expr: ailearn_supervisor_coverage_ratio < 1.0
        for: 10m
        labels:
          severity: warning
          team: platform
        annotations:
          summary: "Supervisor Agent coverage 不完整"
          description: "coverage ratio 低于 100%，当前值 {{ $value | humanizePercentage }}。"
          runbook: "docs/runbooks/card-generation-supervisor-v1-rollout-rollback.md"

      # Shadow 模式异常（计划 §G4）
      - alert: AILearnSupervisorShadowQualityRegression
        expr: |
          (
            rate(ailearn_supervisor_shadow_quality_failures_total[30m])
            /
            rate(ailearn_supervisor_shadow_runs_total[30m])
          ) > 0.05
        for: 30m
        labels:
          severity: warning
          team: platform
        annotations:
          summary: "Supervisor Shadow 质量回退"
          description: "Shadow 模式质量失败率超过 5%。"
          runbook: "docs/runbooks/card-generation-supervisor-v1-rollout-rollback.md"

      # Canary 阶段错误率激增（计划 §G5）
      - alert: AILearnSupervisorCanaryErrorSpike
        expr: |
          (
            rate(ailearn_supervisor_canary_errors_total[10m])
            /
            rate(ailearn_supervisor_canary_runs_total[10m])
          ) > 0.02
        for: 10m
        labels:
          severity: critical
          team: platform
        annotations:
          summary: "Supervisor Canary 错误率激增"
          description: "Canary 阶段错误率超过 2%，需考虑回滚。"
          runbook: "docs/runbooks/card-generation-supervisor-v1-rollout-rollback.md"

  # ─── 搜索索引一致性监控 ─────────────────────────────────────────────────────
  #
  # ARCH-01: Search projection (search_documents) uses savepoint isolation,
  # meaning projection write failures don't block the main transaction. This
  # can cause silent drift between business data and search index. These
  # alerts detect when drift exceeds acceptable thresholds so administrators
  # can trigger reindex before users notice missing search results.
  - name: ailearn_search_consistency
    interval: 60s
    rules:
      # Search index drift detected (ghosts + missing > 0)
      - alert: AILearnSearchIndexDrift
        expr: ailearn_search_drift_total > 0
        for: 10m
        labels:
          severity: warning
          team: platform
        annotations:
          summary: "搜索索引检测到漂移"
          description: "检测到 {{ $value }} 个漂移文档（幽灵或缺失），需检查是否需要触发 reindex。"
          runbook: "docs/operations.md#search-drift"

      # Search index drift ratio exceeds 5% of total documents
      - alert: AILearnHighSearchDriftRatio
        expr: |
          (
            ailearn_search_drift_total
            /
            ailearn_search_documents_total
          ) > 0.05
        for: 15m
        labels:
          severity: critical
          team: platform
        annotations:
          summary: "搜索索引漂移比例过高"
          description: "漂移比例超过 5%，用户可能搜不到最新内容，需立即触发 reindex。"
          runbook: "docs/operations.md#search-drift"
