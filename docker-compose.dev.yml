name: ailearn-dev

# Standalone local-development stack. It intentionally uses fixed local-only
# credentials, dev image targets and source bind mounts for hot reload.
# Do not layer this file on top of docker-compose.yml.

x-dev-database: &dev-database
  DATABASE_URL: postgres://ailearn:ailearn_dev@postgres:5432/ailearn
  DATABASE_URL_MIGRATOR: postgres://ailearn:ailearn_dev@postgres:5432/ailearn
  # API 用受限角色（NOBYPASSRLS），与 CI、生产同形状。dev 以前连着 `ailearn`
  # （superuser + BYPASSRLS），于是 RLS 在这个环境里天然不可见：漏设
  # `app.workspace_id` 的读点不会报错，只会静默返回 0 行（doc 34 L37/L43）。
  # 换过来之后"谁漏了上下文谁当场红"就是想要的行为。
  # 换之前先跑过：CI 点名的 postgres 集测在"夹具写=超级用户 / 被测=ailearn_api"
  # 这套形状下逐个绿，且 `ailearn_api` 对 public 里**每一张表都有 SELECT**（缺授权 0 张）。
  # worker 早就是受限角色（下面那行），这两行现在才对齐。
  DATABASE_URL_API: postgres://ailearn_api:ailearn_dev@postgres:5432/ailearn
  # Worker must use the restricted role; learning-session outbox RLS grants
  # queue-wide claim access only to ailearn_worker.
  DATABASE_URL_WORKER: postgres://ailearn_worker:ailearn_dev@postgres:5432/ailearn

services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ailearn
      POSTGRES_PASSWORD: ailearn_dev
      POSTGRES_DB: ailearn
    ports:
      - "${POSTGRES_BIND_ADDRESS:-127.0.0.1}:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - dev_postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ailearn -d ailearn"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - ailearn_net

  minio:
    image: minio/minio:RELEASE.2024-12-18T13-15-44Z
    profiles: ["storage"]
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ailearn
      MINIO_ROOT_PASSWORD: ailearn_dev_secret
    ports:
      - "${MINIO_BIND_ADDRESS:-127.0.0.1}:${MINIO_PORT:-9000}:9000"
      - "${MINIO_BIND_ADDRESS:-127.0.0.1}:${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - dev_minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - ailearn_net

  # One-shot bucket bootstrap (profile: storage).  `make storage` waits
  # for it to exit and removes the container immediately afterwards.
  minio-init:
    image: minio/mc:RELEASE.2024-11-21T17-21-54Z
    profiles: ["storage"]
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ailearn ailearn_dev_secret;
      mc mb -p local/ailearn-workspaces || true;
      mc anonymous set none local/ailearn-workspaces;
      echo 'minio init done';
      "
    networks:
      - ailearn_net

  # One-shot (restart: "no"): creates the restricted database roles that
  # migrations 0022+ reference (GRANT EXECUTE TO ailearn_worker, etc.).
  # Dev uses fixed passwords; production must set them via .env.
  role-bootstrap:
    image: pgvector/pgvector:pg16
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_USER: ailearn
      POSTGRES_PASSWORD: ailearn_dev
      POSTGRES_DB: ailearn
      MIGRATOR_PASSWORD: ailearn_dev
      API_PASSWORD: ailearn_dev
      WORKER_PASSWORD: ailearn_dev
    volumes:
      - ./infra/postgres/apply-roles.sh:/opt/ailearn/apply-roles.sh:ro
      - ./infra/postgres/roles.sql:/opt/ailearn/roles.sql:ro
    entrypoint: ["/bin/sh", "/opt/ailearn/apply-roles.sh"]
    networks:
      - ailearn_net

  # One-shot (restart: "no"): runs on every `make dev` to apply pending
  # migrations, then is auto-removed by `make clean-init`.
  migrate:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: dev
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
      role-bootstrap:
        condition: service_completed_successfully
    environment:
      <<: *dev-database
      NODE_ENV: development
    volumes:
      - ./apps/api/src:/app/src
      - ./packages/shared:/app/packages/shared
    command: ["npm", "run", "db:migrate"]
    networks:
      - ailearn_net

  # Demo credentials are created only when `make seed-demo` is run.
  # Uses `run --rm` so the container is removed immediately after seeding.
  seed-demo:
    profiles: ["seed"]
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: dev
    restart: "no"
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      <<: *dev-database
      NODE_ENV: development
      SEED_DEMO_DATA: "true"
    volumes:
      - ./apps/api/src:/app/src
      - ./packages/shared:/app/packages/shared
    command: ["npm", "run", "db:seed"]
    networks:
      - ailearn_net

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: dev
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      <<: *dev-database
      NODE_ENV: development
      PORT: 4000
      # Explicitly distinguish the container's internal listener from the
      # host's loopback-only published port.
      API_BIND_ADDRESS: ${API_INTERNAL_BIND_ADDRESS:-0.0.0.0}
      AILEARN_CONTAINER_MODE: "true"
      AILEARN_ALLOW_CONTAINER_WILDCARD: "true"
      AILEARN_DESKTOP_PAIRING_KEY_ID: ${AILEARN_DESKTOP_PAIRING_KEY_ID:-dev-desktop-key}
      AILEARN_DESKTOP_PAIRING_SECRET: ${AILEARN_DESKTOP_PAIRING_SECRET:-}
      AILEARN_DOMAIN_SCHEMA_REVISION: ${AILEARN_DOMAIN_SCHEMA_REVISION:-domain-dev-v1}
      # 开发栈默认不信任透传的 X-Forwarded-For；需要真实前置代理时显式设置。
      TRUST_PROXY: ${TRUST_PROXY:-false}
      # Dev-only explicit grant signing secret（compose 显式配置，非代码回退）：
      # 未配置 AUTH_SURFACE_MANIFEST_SECRET 时 companion grant 签发 fail-closed 503。
      AUTH_SURFACE_MANIFEST_SECRET: ailearn-dev-auth-surface-secret
      AUTH_RATE_LIMIT_STORE: ${AUTH_RATE_LIMIT_STORE:-memory}
      AUTH_RATE_LIMIT_WINDOW_MS: ${AUTH_RATE_LIMIT_WINDOW_MS:-900000}
      # Dev 栈放宽登录限流（E2E 多 spec 连续登录）；生产 compose 保持默认 5 次。
      AUTH_RATE_LIMIT_MAX_ATTEMPTS: ${AUTH_RATE_LIMIT_MAX_ATTEMPTS:-100}
      # The development stack runs the approved companion vertical slices by
      # default. Production remains fail-closed in docker-compose.yml and must
      # opt in explicitly with deployment-owned environment variables.
      # Each service declares exactly the capability flags it reads; the
      # api/worker parity and dev/prod defaults are enforced by
      # .github/scripts/verify-companion-capability-config.mjs (make verify).
      COMPANION_DIALOGUE_V1_ENABLED: ${COMPANION_DIALOGUE_V1_ENABLED:-true}
      COMPANION_VOICE_DIALOGUE_V1_ENABLED: ${COMPANION_VOICE_DIALOGUE_V1_ENABLED:-true}
      COMPANION_STREAMING_VOICE_V1_ENABLED: ${COMPANION_STREAMING_VOICE_V1_ENABLED:-false}
      # AI platform config — all provider/capability config in one JSON file.
      AI_PLATFORMS_CONFIG: /app/config/ai-platforms.json
      DASHSCOPE_API_KEY: ${DASHSCOPE_API_KEY:-}
      OPENAI_COMPAT_API_KEY: ${OPENAI_COMPAT_API_KEY:-}
      SILICONFLOW_API_KEY: ${SILICONFLOW_API_KEY:-}
      BIGMODEL_API_KEY: ${BIGMODEL_API_KEY:-}
      TOKENRHYTHM_API_KEY: ${TOKENRHYTHM_API_KEY:-}
      # 2026-09-18：capabilities.agent_turn（card_generation 经 task-router 映射到它）
      # 已从 opencode-go 切到 **tokenrhythm**（opencode-go 套餐用量耗尽，实测 HTTP 429）。
      # 学习卡生成四阶段与离线评测脚本都走这个 capability，因此 TOKENRHYTHM_API_KEY
      # 是当前生成链路的必需项。换 provider 时必须同步这一行与 config/ai-platforms.json。
      #
      # 2026-09-17：opencode-go 的 key 此前未在 compose 透传（同类事故参见
      # docker-compose.yml 的 Assessment Critic 注释——compose 只传显式列出的变量），
      # 容器内解析为空 → 平台不可用 → 回退 mock → CARD_GENERATION_V2_LLM=true 时
      # fail-closed，学习卡生成永远失败。保留该 key 以便切回时无需再改 compose。
      OPENCODE_GO_API_KEY: ${OPENCODE_GO_API_KEY:-}
      # 方案 16：LearningRun 独立 Assessment Critic（OpenAI-compatible；未配置 fail closed）。
      ASSESSMENT_CRITIC_URL: ${ASSESSMENT_CRITIC_URL:-}
      ASSESSMENT_CRITIC_KEY: ${ASSESSMENT_CRITIC_KEY:-}
      ASSESSMENT_CRITIC_MODEL: ${ASSESSMENT_CRITIC_MODEL:-qwen-plus}
      # 语音：SiliconFlow ASR（外部 API）+ edge-tts TTS（Docker 容器）
      EDGE_TTS_BASE_URL: ${EDGE_TTS_BASE_URL:-http://edge-tts:8080}
      EDGE_TTS_AUTH_TOKEN: ${EDGE_TTS_AUTH_TOKEN:?Set EDGE_TTS_AUTH_TOKEN in .env（edge-tts 与 api 必须一致）}
      # Docker Desktop proxies public DNS through 198.18.0.0/15. This remains
      # explicit and development-only; production defaults to strict blocking.
      AI_ALLOW_DOCKER_DESKTOP_SYNTHETIC_DNS: ${AI_ALLOW_DOCKER_DESKTOP_SYNTHETIC_DNS:-true}
      # macOS Docker: inotify events are unreliable across the bind mount.
      # Force polling so tsx watch actually picks up source changes.
      CHOKIDAR_USEPOLLING: "true"
      CHOKIDAR_INTERVAL: "1000"
      # 文档 16：LearningRun 统一底座与 Journey V2（与本地 node 直跑同一套 env 契约）。
      LEARNING_RUN_ENABLED: ${LEARNING_RUN_ENABLED:-true}
      COMPANION_JOURNEY_V2: ${COMPANION_JOURNEY_V2:-true}
      COMPANION_BRIDGE_V2: ${COMPANION_BRIDGE_V2:-true}
      # 方案 20：V2 价值优先生成（dev 默认开启）。
      # CARD_GENERATION_V2_LLM 只由 worker 读取，因此只声明在 worker 服务。
      CARD_GENERATION_V2_ENABLED: ${CARD_GENERATION_V2_ENABLED:-true}
      # 方案 16 伴星/记忆/总结/画像/主动个性化（dev 默认开启）。
      # COMPANION_MEMORY_EXTRACTOR_V1 只由 worker 读取，因此只声明在 worker 服务。
      COMPANION_DAILY_SUMMARY_V1: ${COMPANION_DAILY_SUMMARY_V1:-true}
      COMPANION_MEMORY_VECTOR_V1: ${COMPANION_MEMORY_VECTOR_V1:-true}
      COMPANION_PET_PROFILE_V1: ${COMPANION_PET_PROFILE_V1:-true}
      COMPANION_PROACTIVE_PERSONALIZED_V1: ${COMPANION_PROACTIVE_PERSONALIZED_V1:-true}
      COMPANION_SUMMARIZER_V1: ${COMPANION_SUMMARIZER_V1:-true}
      COMPANION_MEMORY_STAR_MAP_V1: ${COMPANION_MEMORY_STAR_MAP_V1:-true}
      # 方案 16/20 trusted Commit 评估（dev 默认开启）。
      LEARNING_DRAFT_ENC_KEY: ${LEARNING_DRAFT_ENC_KEY:-}
      PROJECTION_CHECKPOINT_SECRET: ${PROJECTION_CHECKPOINT_SECRET:-}
      # Image upload: MinIO/S3 storage endpoint and credentials.
      # Must match the dev minio service's MINIO_ROOT_USER/PASSWORD below.
      STORAGE_ENDPOINT: http://minio:9000
      S3_BUCKET: ${S3_BUCKET:-ailearn-workspaces}
      MINIO_ROOT_USER: ailearn
      MINIO_ROOT_PASSWORD: ailearn_dev_secret
    ports:
      - "${API_BIND_ADDRESS:-127.0.0.1}:${API_PORT:-4000}:4000"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:4000/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 5s
      timeout: 5s
      retries: 12
    volumes:
      - ./apps/api/src:/app/src
      - ./packages/shared:/app/packages/shared
      - ./config:/app/config:ro
    networks:
      - ailearn_net

  worker:
    build:
      context: .
      dockerfile: workers/ai-worker/Dockerfile
      target: dev
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      <<: *dev-database
      NODE_ENV: development
      # AI platform config — all provider/capability config in one JSON file.
      AI_PLATFORMS_CONFIG: /app/config/ai-platforms.json
      DASHSCOPE_API_KEY: ${DASHSCOPE_API_KEY:-}
      OPENAI_COMPAT_API_KEY: ${OPENAI_COMPAT_API_KEY:-}
      SILICONFLOW_API_KEY: ${SILICONFLOW_API_KEY:-}
      BIGMODEL_API_KEY: ${BIGMODEL_API_KEY:-}
      TOKENRHYTHM_API_KEY: ${TOKENRHYTHM_API_KEY:-}
      # 2026-09-18：capabilities.agent_turn（card_generation 经 task-router 映射到它）
      # 已从 opencode-go 切到 **tokenrhythm**（opencode-go 套餐用量耗尽，实测 HTTP 429）。
      # 学习卡生成四阶段与离线评测脚本都走这个 capability，因此 TOKENRHYTHM_API_KEY
      # 是当前生成链路的必需项。换 provider 时必须同步这一行与 config/ai-platforms.json。
      #
      # 2026-09-17：opencode-go 的 key 此前未在 compose 透传（同类事故参见
      # docker-compose.yml 的 Assessment Critic 注释——compose 只传显式列出的变量），
      # 容器内解析为空 → 平台不可用 → 回退 mock → CARD_GENERATION_V2_LLM=true 时
      # fail-closed，学习卡生成永远失败。保留该 key 以便切回时无需再改 compose。
      OPENCODE_GO_API_KEY: ${OPENCODE_GO_API_KEY:-}
      AI_ALLOW_DOCKER_DESKTOP_SYNTHETIC_DNS: ${AI_ALLOW_DOCKER_DESKTOP_SYNTHETIC_DNS:-true}
      # Keep worker-side execution authorization aligned with the API
      # bootstrap/routes; otherwise the API accepts a turn that the worker
      # immediately rejects as feature-disabled. Only the companion flags the
      # worker actually reads are declared here.
      COMPANION_DIALOGUE_V1_ENABLED: ${COMPANION_DIALOGUE_V1_ENABLED:-true}
      COMPANION_VOICE_DIALOGUE_V1_ENABLED: ${COMPANION_VOICE_DIALOGUE_V1_ENABLED:-true}
      # 方案 20：V2 价值优先生成的四个阶段 LLM 模式只在 worker 侧生效。
      CARD_GENERATION_V2_LLM: ${CARD_GENERATION_V2_LLM:-true}
      # 2026-09-17：author/grounding 逐候选调用的**阶段内并发上限**（此前硬串行：
      # 墙钟 = N × 单次 provider 延迟）。默认 12：服务端卡上限 20，取 12 让实测
      # 规模（N≈5）一波跑完；实测 6 并发无限流。调大可能触发 provider 429。
      V2_STAGE_CONCURRENCY: ${V2_STAGE_CONCURRENCY:-12}
      # 2026-09-17：投机 pedagogy（与 grounding 波并发，集合未变则复用）。
      # 关掉即为"grounding 完成后再调 pedagogy"的确定性调度。
      V2_SPECULATIVE_PEDAGOGY: ${V2_SPECULATIVE_PEDAGOGY:-1}
      # 方案 16 伴星记忆抽取/向量/总结/日记（dev 默认开启）。
      COMPANION_MEMORY_EXTRACTOR_V1: ${COMPANION_MEMORY_EXTRACTOR_V1:-true}
      COMPANION_MEMORY_VECTOR_V1: ${COMPANION_MEMORY_VECTOR_V1:-true}
      COMPANION_SUMMARIZER_V1: ${COMPANION_SUMMARIZER_V1:-true}
      COMPANION_DAILY_SUMMARY_V1: ${COMPANION_DAILY_SUMMARY_V1:-true}
      COMPANION_THOUGHTS_V1: ${COMPANION_THOUGHTS_V1:-true}
      # 方案 16/20 trusted Commit 评估（dev 默认开启）。
      # Source image upload: MinIO/S3 storage for embedded images
      STORAGE_ENDPOINT: http://minio:9000
      S3_BUCKET: ${S3_BUCKET:-ailearn-workspaces}
      MINIO_ROOT_USER: ailearn
      MINIO_ROOT_PASSWORD: ailearn_dev_secret
      # Handler timeouts (ms) — per job type, clamped below lease timeout (120s)
      WORKER_MODEL_TIMEOUT_MS: ${WORKER_MODEL_TIMEOUT_MS:-}
      WORKER_PROVIDER_TIMEOUT_MS: ${WORKER_PROVIDER_TIMEOUT_MS:-75000}
      # V2 生成调试：失败时打印 author/planner 原始输出与 parse issues（溯源用）。
      V2_E2E_DEBUG_ERRORS: ${V2_E2E_DEBUG_ERRORS:-1}
      WORKER_TIMEOUT_PARSE_SOURCE_MS: ${WORKER_TIMEOUT_PARSE_SOURCE_MS:-}
      WORKER_METRICS_PORT: ${WORKER_METRICS_PORT:-9100}
      # macOS Docker: same polling fix as the api service.
      CHOKIDAR_USEPOLLING: "true"
      CHOKIDAR_INTERVAL: "1000"
    ports:
      - "${WORKER_METRICS_BIND_ADDRESS:-127.0.0.1}:${WORKER_METRICS_PORT:-9100}:${WORKER_METRICS_PORT:-9100}"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"const port=process.env.WORKER_METRICS_PORT || '9100'; fetch('http://127.0.0.1:'+port+'/metrics').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 5s
      timeout: 5s
      start_period: 10s
      retries: 12
    volumes:
      - ./workers/ai-worker/src:/app/src
      - ./packages/shared:/app/packages/shared
      - ./config:/app/config:ro
    networks:
      - ailearn_net

  # edge-tts：TTS 服务（Docker 容器内运行；开发环境同网络）
  edge-tts:
    build:
      context: .
      dockerfile: docker/edge-tts/Dockerfile
    user: nobody
    restart: unless-stopped
    environment:
      EDGE_TTS_AUTH_TOKEN: ${EDGE_TTS_AUTH_TOKEN:?Set EDGE_TTS_AUTH_TOKEN in .env（edge-tts 与 api 必须一致）}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    security_opt:
      - no-new-privileges:true
    networks:
      - ailearn_net

volumes:
  # Keep PostgreSQL outside the Compose lifecycle so even `down -v` cannot
  # remove it accidentally. `make up` creates it; only the confirmed
  # `make reset-db CONFIRM_RESET_DB=DELETE_DEV_DB` path deletes it.
  dev_postgres_data:
    name: ailearn-dev_dev_postgres_data
    external: true
  dev_minio_data:

networks:
  ailearn_net:
    driver: bridge
