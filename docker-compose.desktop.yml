# AI Learn — Desktop compose file
#
# Local-only stack for the macOS desktop app. Uses fixed local credentials
# and the prod image targets (no bind mounts, no hot-reload).
# All ports bind to 127.0.0.1 — nothing is reachable from the network.
#
# Usage (by the Electron desktop app):
#   docker compose -f docker-compose.desktop.yml -p ailearn-desktop up -d --build

x-desktop-db: &desktop-db
  DATABASE_URL: postgres://ailearn:ailearn_desktop@postgres:5432/ailearn
  DATABASE_URL_MIGRATOR: postgres://ailearn:ailearn_desktop@postgres:5432/ailearn
  DATABASE_URL_API: postgres://ailearn:ailearn_desktop@postgres:5432/ailearn
  DATABASE_URL_WORKER: postgres://ailearn:ailearn_desktop@postgres:5432/ailearn

x-desktop-build: &desktop-build
  context: .
  # Use the prod target so there are no bind mounts or hot-reload.

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ailearn
      POSTGRES_PASSWORD: ailearn_desktop
      POSTGRES_DB: ailearn
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - desktop_postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ailearn -d ailearn"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - ailearn_desktop_net

  minio:
    image: minio/minio:RELEASE.2024-12-18T13-15-44Z
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ailearn
      MINIO_ROOT_PASSWORD: ailearn_desktop_secret
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - desktop_minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - ailearn_desktop_net

  minio-init:
    image: minio/mc:RELEASE.2024-11-21T17-21-54Z
    restart: "no"
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ailearn ailearn_desktop_secret;
      mc mb -p local/ailearn-workspaces || true;
      mc anonymous set none local/ailearn-workspaces;
      echo 'minio init done';
      "
    networks:
      - ailearn_desktop_net

  role-bootstrap:
    image: postgres:16-alpine
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_USER: ailearn
      POSTGRES_PASSWORD: ailearn_desktop
      POSTGRES_DB: ailearn
      MIGRATOR_PASSWORD: ailearn_desktop
      API_PASSWORD: ailearn_desktop
      WORKER_PASSWORD: ailearn_desktop
    volumes:
      - ./infra/postgres/apply-roles.sh:/opt/ailearn/apply-roles.sh:ro
      - ./infra/postgres/roles.sql:/opt/ailearn/roles.sql:ro
    entrypoint: ["/bin/sh", "/opt/ailearn/apply-roles.sh"]
    networks:
      - ailearn_desktop_net

  migrate:
    build:
      <<: *desktop-build
      dockerfile: apps/api/Dockerfile
      target: prod
    user: node
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
      role-bootstrap:
        condition: service_completed_successfully
    environment:
      <<: *desktop-db
      NODE_ENV: production
    command: ["npm", "run", "db:migrate"]
    networks:
      - ailearn_desktop_net

  role-grants:
    image: postgres:16-alpine
    restart: "no"
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_USER: ailearn
      POSTGRES_PASSWORD: ailearn_desktop
      POSTGRES_DB: ailearn
      MIGRATOR_PASSWORD: ailearn_desktop
      API_PASSWORD: ailearn_desktop
      WORKER_PASSWORD: ailearn_desktop
      REQUIRE_RLS_DISABLED: "true"
    volumes:
      - ./infra/postgres/apply-roles.sh:/opt/ailearn/apply-roles.sh:ro
      - ./infra/postgres/roles.sql:/opt/ailearn/roles.sql:ro
    entrypoint: ["/bin/sh", "/opt/ailearn/apply-roles.sh"]
    networks:
      - ailearn_desktop_net

  api:
    build:
      <<: *desktop-build
      dockerfile: apps/api/Dockerfile
      target: prod
    user: node
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      role-grants:
        condition: service_completed_successfully
    environment:
      <<: *desktop-db
      NODE_ENV: production
      PORT: 4000
      CORS_ORIGIN: http://localhost:3000
      LOG_LEVEL: info
      TRUST_PROXY: loopback,linklocal,uniquelocal
      AUTH_RATE_LIMIT_STORE: memory
      SCHEDULER_POLICY_VERSION: discrete-v2
      FSRS_SHADOW_ENABLED: "true"
      CARD_GENERATION_V2_ENABLED: "true"
      AI_ALLOW_DOCKER_DESKTOP_SYNTHETIC_DNS: "true"
      # Deterministic local-only key. Desktop uses the same dev key.
      AI_CREDENTIAL_ENCRYPTION_KEY: "000102030405060708090a0b0c0d0e0f101112131415161718191a1b1c1d1e1f"
      AUTH_COOKIE_SECURE: "false"
      STORAGE_ENDPOINT: http://minio:9000
      S3_BUCKET: ailearn-workspaces
      MINIO_ROOT_USER: ailearn
      MINIO_ROOT_PASSWORD: ailearn_desktop_secret
    ports:
      - "127.0.0.1:4000:4000"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:4000/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 5s
      timeout: 5s
      retries: 12
    networks:
      - ailearn_desktop_net

  worker:
    build:
      <<: *desktop-build
      dockerfile: workers/ai-worker/Dockerfile
      target: prod
    user: node
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      role-grants:
        condition: service_completed_successfully
    environment:
      <<: *desktop-db
      NODE_ENV: production
      AI_PROVIDER_CARD: mock
      AI_CREDENTIAL_ENCRYPTION_KEY: "000102030405060708090a0b0c0d0e0f101112131415161718191a1b1c1d1e1f"
      AI_ALLOW_DOCKER_DESKTOP_SYNTHETIC_DNS: "true"
      API_INTERNAL_URL: http://api:4000
      AI_QUESTION_V1_ENABLED: "true"
      RUBRIC_EVALUATION_V1_ENABLED: "true"
      CARD_REPAIR_V1_ENABLED: "true"
      SCHEDULER_POLICY_VERSION: discrete-v2
      FSRS_SHADOW_ENABLED: "true"
      CARD_GENERATION_V2_ENABLED: "true"
      STORAGE_ENDPOINT: http://minio:9000
      S3_BUCKET: ailearn-workspaces
      MINIO_ROOT_USER: ailearn
      MINIO_ROOT_PASSWORD: ailearn_desktop_secret
      LOG_LEVEL: info
      WORKER_METRICS_PORT: "9100"
    ports:
      - "127.0.0.1:9100:9100"
    networks:
      - ailearn_desktop_net

# NOTE: The web (Next.js) service runs natively inside Electron, not in Docker.
# The Electron main process spawns `next start` (or `next dev` in development)
# and loads http://localhost:3000 in a BrowserWindow.
# The Next.js app proxies /api/* requests to the API container via INTERNAL_API_URL.

volumes:
  desktop_postgres_data:
    name: ailearn-desktop_postgres_data
  desktop_minio_data:
    name: ailearn-desktop_minio_data

networks:
  ailearn_desktop_net:
    driver: bridge
