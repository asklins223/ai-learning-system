name: CI

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22"

jobs:
  release-inputs:
    name: Clean Release Inputs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      # A release must be reproducible from Git alone. This also catches a
      # journal entry whose SQL file was left untracked in a local workspace.
      - name: Verify clean checkout and required release files
        run: node .github/scripts/verify-release-inputs.mjs

  typecheck:
    name: TypeCheck & Lint
    runs-on: ubuntu-latest
    needs: release-inputs
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            apps/api/package-lock.json
            apps/web/package-lock.json
            workers/ai-worker/package-lock.json
            packages/db/package-lock.json
            packages/shared/package-lock.json

      - name: Install shared
        working-directory: packages/shared
        run: npm ci --no-audit --no-fund

      - name: Install db
        working-directory: packages/db
        run: npm ci --no-audit --no-fund

      - name: Install API
        working-directory: apps/api
        run: npm ci --no-audit --no-fund

      - name: Install Web
        working-directory: apps/web
        run: npm ci --no-audit --no-fund

      - name: Install Worker
        working-directory: workers/ai-worker
        run: npm ci --no-audit --no-fund

      - name: TypeCheck API
        working-directory: apps/api
        run: npx tsc --noEmit

      - name: TypeCheck Web
        working-directory: apps/web
        run: npx tsc --noEmit

      - name: TypeCheck Worker
        working-directory: workers/ai-worker
        run: npx tsc --noEmit

      - name: Lint Web
        working-directory: apps/web
        env:
          # F-018: 确保非交互模式，不提示 ESLint 配置向导
          CI: true
        run: npx eslint . --max-warnings=0

      # F-016: 生产依赖审计门禁 — 0 high/critical 才通过
      - name: Audit Web production deps
        working-directory: apps/web
        run: npm audit --omit=dev --audit-level=high

      - name: Audit API production deps
        working-directory: apps/api
        run: npm audit --omit=dev --audit-level=high

      - name: Audit Worker production deps
        working-directory: workers/ai-worker
        run: npm audit --omit=dev --audit-level=high

  build:
    name: Build (API / Web / Worker)
    runs-on: ubuntu-latest
    needs: typecheck
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            apps/api/package-lock.json
            apps/web/package-lock.json
            workers/ai-worker/package-lock.json
            packages/db/package-lock.json
            packages/shared/package-lock.json

      - name: Install shared
        working-directory: packages/shared
        run: npm ci --no-audit --no-fund

      - name: Install db
        working-directory: packages/db
        run: npm ci --no-audit --no-fund

      - name: Install API
        working-directory: apps/api
        run: npm ci --no-audit --no-fund

      - name: Install Web
        working-directory: apps/web
        run: npm ci --no-audit --no-fund

      - name: Install Worker
        working-directory: workers/ai-worker
        run: npm ci --no-audit --no-fund

      # F-018: 真实 build 步骤 — 确保 esbuild/next build 产出文件
      - name: Build API
        working-directory: apps/api
        run: npm run build

      - name: Verify API build output
        working-directory: apps/api
        run: |
          test -f dist/server.cjs || {
            echo >&2 "API build failed: dist/server.cjs missing"
            exit 1
          }
          echo "API build OK"

      # G-002: Smoke test — 确保产物可被 Node 执行（防止 ESM/CJS 格式错误）
      - name: Smoke test API build
        working-directory: apps/api
        env:
          NODE_ENV: production
          DATABASE_URL_API: postgres://ailearn_api:ci-smoke-only@127.0.0.1:1/ailearn
        run: timeout 5 node dist/server.cjs || test $? -eq 124 && echo "API server started (timeout expected)"

      - name: Build Worker
        working-directory: workers/ai-worker
        run: npm run build

      - name: Verify Worker build output
        working-directory: workers/ai-worker
        run: |
          test -f dist/index.cjs || {
            echo >&2 "Worker build failed: dist/index.cjs missing"
            exit 1
          }
          echo "Worker build OK"

      # G-002: Smoke test — 确保产物可被 Node 执行
      - name: Smoke test Worker build
        working-directory: workers/ai-worker
        env:
          NODE_ENV: production
          DATABASE_URL_WORKER: postgres://ailearn_worker:ci-smoke-only@127.0.0.1:1/ailearn
        run: timeout 5 node dist/index.cjs || test $? -eq 124 && echo "Worker started (timeout expected)"

      - name: Build Web
        working-directory: apps/web
        run: npm run build

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: typecheck
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            apps/api/package-lock.json
            apps/web/package-lock.json
            workers/ai-worker/package-lock.json
            packages/shared/package-lock.json

      # API and Worker load the shared package from its workspace source path.
      # Install its runtime dependencies explicitly in a clean checkout so
      # imports such as zod resolve from packages/shared/node_modules.
      - name: Install shared
        working-directory: packages/shared
        run: npm ci --no-audit --no-fund

      - name: Install Web
        working-directory: apps/web
        run: npm ci --no-audit --no-fund

      # F-018: 基础单元测试 — 覆盖 markdown-blocks 往返、分页参数 clamp 等关键链路
      - name: Run Web unit tests
        working-directory: apps/web
        run: npm test

      - name: Run API unit tests
        working-directory: apps/api
        run: |
          npm ci --no-audit --no-fund
          npm test

      - name: Run Worker unit tests
        working-directory: workers/ai-worker
        run: |
          npm ci --no-audit --no-fund
          npm test

  fresh-migrations:
    name: Fresh PostgreSQL Migrations
    runs-on: ubuntu-latest
    needs: typecheck
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ailearn
          POSTGRES_PASSWORD: ci-migration-only-password
          POSTGRES_DB: ailearn_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ailearn -d ailearn_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL: postgres://ailearn:ci-migration-only-password@127.0.0.1:5432/ailearn_ci
      DATABASE_URL_MIGRATOR: postgres://ailearn_migrator:ci-migrator-only-password@127.0.0.1:5432/ailearn_ci
      DATABASE_URL_API: postgres://ailearn_api:ci-api-only-password@127.0.0.1:5432/ailearn_ci
      UPGRADE_DATABASE_URL: postgres://ailearn:ci-migration-only-password@127.0.0.1:5432/ailearn_upgrade_ci
      UPGRADE_DATABASE_URL_MIGRATOR: postgres://ailearn_migrator:ci-migrator-only-password@127.0.0.1:5432/ailearn_upgrade_ci
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_USER: ailearn
      POSTGRES_PASSWORD: ci-migration-only-password
      POSTGRES_DB: ailearn_ci
      MIGRATOR_PASSWORD: ci-migrator-only-password
      API_PASSWORD: ci-api-only-password
      WORKER_PASSWORD: ci-worker-only-password
      NODE_ENV: production
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            apps/api/package-lock.json
            packages/shared/package-lock.json

      - name: Install shared
        working-directory: packages/shared
        run: npm ci --no-audit --no-fund

      - name: Install API
        working-directory: apps/api
        # NODE_ENV=production would otherwise omit tsx, which db:migrate uses.
        run: npm ci --include=dev --no-audit --no-fund

      - name: Bootstrap least-privilege roles for the empty database
        run: |
          docker run --rm --network host \
            -v "$PWD/infra/postgres:/opt/ailearn:ro" \
            -e POSTGRES_HOST -e POSTGRES_USER -e POSTGRES_PASSWORD -e POSTGRES_DB \
            -e MIGRATOR_PASSWORD -e API_PASSWORD -e WORKER_PASSWORD \
            postgres:16-alpine /bin/sh /opt/ailearn/apply-roles.sh

      - name: Migrate an empty database
        working-directory: apps/api
        run: npm run db:migrate

      - name: Re-run migrations (idempotence)
        working-directory: apps/api
        run: npm run db:migrate

      - name: Apply and verify empty-database role grants
        env:
          REQUIRE_RLS_DISABLED: "true"
        run: |
          docker run --rm --network host \
            -v "$PWD/infra/postgres:/opt/ailearn:ro" \
            -e POSTGRES_HOST -e POSTGRES_USER -e POSTGRES_PASSWORD -e POSTGRES_DB \
            -e MIGRATOR_PASSWORD -e API_PASSWORD -e WORKER_PASSWORD \
            -e REQUIRE_RLS_DISABLED \
            postgres:16-alpine /bin/sh /opt/ailearn/apply-roles.sh

      - name: Verify shared PostgreSQL auth rate limiting
        working-directory: apps/api
        env:
          NODE_ENV: test
          RATE_LIMIT_TEST_DATABASE_URL: ${{ env.DATABASE_URL_API }}
        run: node --import tsx --test src/__tests__/identity-security.test.ts

      - name: Verify every journal migration was applied
        working-directory: apps/api
        run: |
          node --input-type=module <<'NODE'
          import { readFile } from "node:fs/promises";
          import postgres from "postgres";

          const journal = JSON.parse(
            await readFile("src/db/migrations/meta/_journal.json", "utf8"),
          );
          const sql = postgres(process.env.DATABASE_URL, { max: 1 });
          try {
            const [{ count }] = await sql`
              SELECT count(*)::integer AS count
              FROM drizzle.__drizzle_migrations
            `;
            if (Number(count) !== journal.entries.length) {
              throw new Error(
                `migration count mismatch: database=${count}, journal=${journal.entries.length}`,
              );
            }
            console.log(`all ${count} migrations are recorded`);
          } finally {
            await sql.end();
          }
          NODE

      - name: Materialize a representative 0012 migration baseline
        working-directory: apps/api
        env:
          BASELINE_DIR: ${{ runner.temp }}/ailearn-migrations-0012
        run: |
          node --input-type=module <<'NODE'
          import { copyFile, mkdir, readFile, rm, writeFile } from "node:fs/promises";
          import { join } from "node:path";

          const source = "src/db/migrations";
          const target = process.env.BASELINE_DIR;
          const journal = JSON.parse(
            await readFile(join(source, "meta", "_journal.json"), "utf8"),
          );
          const entries = journal.entries.filter((entry) => entry.idx <= 12);
          if (entries.length !== 13 || entries.at(-1)?.tag !== "0012_jobs_lease_token") {
            throw new Error("0012 migration baseline is not the expected 13 entries");
          }

          await rm(target, { recursive: true, force: true });
          await mkdir(join(target, "meta"), { recursive: true });
          for (const entry of entries) {
            await copyFile(
              join(source, `${entry.tag}.sql`),
              join(target, `${entry.tag}.sql`),
            );
          }
          await writeFile(
            join(target, "meta", "_journal.json"),
            `${JSON.stringify({ ...journal, entries }, null, 2)}\n`,
          );
          console.log(`prepared ${entries.length}-migration baseline at ${target}`);
          NODE

      - name: Create representative upgrade database
        working-directory: apps/api
        run: |
          node --input-type=module <<'NODE'
          import postgres from "postgres";

          const adminUrl = new URL(process.env.DATABASE_URL);
          adminUrl.pathname = "/postgres";
          const sql = postgres(adminUrl.toString(), { max: 1 });
          try {
            await sql.unsafe("DROP DATABASE IF EXISTS ailearn_upgrade_ci WITH (FORCE)");
            await sql.unsafe("CREATE DATABASE ailearn_upgrade_ci");
          } finally {
            await sql.end();
          }
          NODE

      - name: Bootstrap roles in representative upgrade database
        env:
          POSTGRES_DB: ailearn_upgrade_ci
        run: |
          docker run --rm --network host \
            -v "$PWD/infra/postgres:/opt/ailearn:ro" \
            -e POSTGRES_HOST -e POSTGRES_USER -e POSTGRES_PASSWORD -e POSTGRES_DB \
            -e MIGRATOR_PASSWORD -e API_PASSWORD -e WORKER_PASSWORD \
            postgres:16-alpine /bin/sh /opt/ailearn/apply-roles.sh

      - name: Migrate representative database to 0012
        working-directory: apps/api
        env:
          DATABASE_URL: ${{ env.UPGRADE_DATABASE_URL }}
          DATABASE_URL_MIGRATOR: ${{ env.UPGRADE_DATABASE_URL_MIGRATOR }}
          MIGRATIONS_FOLDER: ${{ runner.temp }}/ailearn-migrations-0012
        run: npm run db:migrate

      - name: Add legacy enum, RLS, and duplicate-data fixture
        working-directory: apps/api
        env:
          DATABASE_URL: ${{ env.UPGRADE_DATABASE_URL }}
        run: |
          node --input-type=module <<'NODE'
          import postgres from "postgres";

          const sql = postgres(process.env.DATABASE_URL, { max: 1 });
          const statements = [
            `INSERT INTO users (id, email, password_hash)
             VALUES ('00000000-0000-0000-0000-000000000101', 'migration-upgrade@example.invalid', 'not-used')`,
            `INSERT INTO workspaces (id, owner_id, name)
             VALUES ('00000000-0000-0000-0000-000000000201', '00000000-0000-0000-0000-000000000101', 'migration-upgrade')`,
            `INSERT INTO workspace_members (workspace_id, user_id, role)
             VALUES ('00000000-0000-0000-0000-000000000201', '00000000-0000-0000-0000-000000000101', 'owner')`,
            `INSERT INTO notes (id, workspace_id, title, created_by)
             VALUES ('00000000-0000-0000-0000-000000000301', '00000000-0000-0000-0000-000000000201', 'migration-upgrade', '00000000-0000-0000-0000-000000000101')`,
            `INSERT INTO note_versions (id, note_id, workspace_id, version_no, content_json, created_by)
             VALUES ('00000000-0000-0000-0000-000000000401', '00000000-0000-0000-0000-000000000301', '00000000-0000-0000-0000-000000000201', 1, '{}'::jsonb, '00000000-0000-0000-0000-000000000101')`,
            `UPDATE notes SET current_version_id = '00000000-0000-0000-0000-000000000401'
             WHERE id = '00000000-0000-0000-0000-000000000301'`,
            `INSERT INTO ai_artifacts (id, workspace_id, type, input_refs, output, model_id, prompt_version, status)
             VALUES ('00000000-0000-0000-0000-000000000801', '00000000-0000-0000-0000-000000000201', 'learning_card', '{}'::jsonb, '{}'::jsonb, 'fixture', 'fixture', 'ready')`,
            `INSERT INTO learning_cards (id, note_version_id, workspace_id, schema_json, artifact_id, created_at, updated_at)
             VALUES
               ('00000000-0000-0000-0000-000000000501', '00000000-0000-0000-0000-000000000401', '00000000-0000-0000-0000-000000000201', '{"title":"old","summary":"old"}'::jsonb, '00000000-0000-0000-0000-000000000801', now() - interval '1 minute', now() - interval '1 minute'),
               ('00000000-0000-0000-0000-000000000502', '00000000-0000-0000-0000-000000000401', '00000000-0000-0000-0000-000000000201', '{"title":"new","summary":"new"}'::jsonb, '00000000-0000-0000-0000-000000000801', now(), now())`,
            `INSERT INTO jobs (id, type, workspace_id, payload, status, scheduled_at)
             VALUES
               ('00000000-0000-0000-0000-000000000601', 'generate_card', '00000000-0000-0000-0000-000000000201', '{"noteVersionId":"00000000-0000-0000-0000-000000000401"}'::jsonb, 'pending', now() - interval '1 minute'),
               ('00000000-0000-0000-0000-000000000602', 'generate_card', '00000000-0000-0000-0000-000000000201', '{"noteVersionId":"00000000-0000-0000-0000-000000000401"}'::jsonb, 'pending', now()),
               ('00000000-0000-0000-0000-000000000603', 'evaluate_validation', '00000000-0000-0000-0000-000000000201', '{}'::jsonb, 'succeeded', now())`,
            `INSERT INTO validation_events (id, workspace_id, user_id, card_id, question, question_type, user_answer, outcome, confidence, job_id, created_at)
             VALUES
               ('00000000-0000-0000-0000-000000000701', '00000000-0000-0000-0000-000000000201', '00000000-0000-0000-0000-000000000101', '00000000-0000-0000-0000-000000000502', 'old?', 'explain', 'old', 'unknown', 0, '00000000-0000-0000-0000-000000000603', now() - interval '1 minute'),
               ('00000000-0000-0000-0000-000000000702', '00000000-0000-0000-0000-000000000201', '00000000-0000-0000-0000-000000000101', '00000000-0000-0000-0000-000000000502', 'new?', 'explain', 'new', 'unknown', 0, '00000000-0000-0000-0000-000000000603', now())`,
            `ALTER TABLE ai_artifacts ALTER COLUMN status DROP DEFAULT`,
            `ALTER TABLE ai_artifacts ALTER COLUMN status SET DATA TYPE text USING status::text`,
            `DROP TYPE artifact_status`,
            `CREATE TYPE artifact_status AS ENUM ('draft', 'accepted', 'rejected', 'superseded')`,
            `UPDATE ai_artifacts SET status = 'draft' WHERE id = '00000000-0000-0000-0000-000000000801'`,
            `ALTER TABLE ai_artifacts ALTER COLUMN status SET DATA TYPE artifact_status USING status::artifact_status`,
            `ALTER TABLE ai_artifacts ALTER COLUMN status SET DEFAULT 'draft'`,
            `ALTER TABLE validation_events ALTER COLUMN outcome SET DATA TYPE text USING outcome::text`,
            `DROP TYPE validation_outcome`,
            `CREATE TYPE validation_outcome AS ENUM ('preliminary', 'validated', 'unclear', 'misunderstanding', 'unknown')`,
            `UPDATE validation_events SET outcome = CASE id
               WHEN '00000000-0000-0000-0000-000000000701' THEN 'validated'
               ELSE 'unclear' END`,
            `ALTER TABLE validation_events ALTER COLUMN outcome SET DATA TYPE validation_outcome USING outcome::validation_outcome`,
            `CREATE POLICY notes_workspace_policy ON notes USING (true) WITH CHECK (true)`,
            `ALTER TABLE notes ENABLE ROW LEVEL SECURITY`,
            `ALTER TABLE notes FORCE ROW LEVEL SECURITY`,
          ];

          try {
            await sql.begin(async (tx) => {
              for (const statement of statements) await tx.unsafe(statement);
            });
          } finally {
            await sql.end();
          }
          NODE

      - name: Reconcile upgrade-fixture ownership before migration
        env:
          POSTGRES_DB: ailearn_upgrade_ci
        run: |
          docker run --rm --network host \
            -v "$PWD/infra/postgres:/opt/ailearn:ro" \
            -e POSTGRES_HOST -e POSTGRES_USER -e POSTGRES_PASSWORD -e POSTGRES_DB \
            -e MIGRATOR_PASSWORD -e API_PASSWORD -e WORKER_PASSWORD \
            postgres:16-alpine /bin/sh /opt/ailearn/apply-roles.sh

      - name: Upgrade representative 0012 database to latest
        working-directory: apps/api
        env:
          DATABASE_URL: ${{ env.UPGRADE_DATABASE_URL }}
          DATABASE_URL_MIGRATOR: ${{ env.UPGRADE_DATABASE_URL_MIGRATOR }}
        run: npm run db:migrate

      - name: Apply and verify upgraded-database role grants
        env:
          POSTGRES_DB: ailearn_upgrade_ci
          REQUIRE_RLS_DISABLED: "true"
        run: |
          docker run --rm --network host \
            -v "$PWD/infra/postgres:/opt/ailearn:ro" \
            -e POSTGRES_HOST -e POSTGRES_USER -e POSTGRES_PASSWORD -e POSTGRES_DB \
            -e MIGRATOR_PASSWORD -e API_PASSWORD -e WORKER_PASSWORD \
            -e REQUIRE_RLS_DISABLED \
            postgres:16-alpine /bin/sh /opt/ailearn/apply-roles.sh

      - name: Verify representative upgrade invariants
        working-directory: apps/api
        env:
          DATABASE_URL: ${{ env.UPGRADE_DATABASE_URL }}
        run: |
          node --input-type=module <<'NODE'
          import { readFile } from "node:fs/promises";
          import postgres from "postgres";

          const sql = postgres(process.env.DATABASE_URL, { max: 1 });
          const workspaceId = "00000000-0000-0000-0000-000000000201";
          const versionId = "00000000-0000-0000-0000-000000000401";
          const evaluateJobId = "00000000-0000-0000-0000-000000000603";
          const assert = (condition, message) => {
            if (!condition) throw new Error(message);
          };

          try {
            const journal = JSON.parse(
              await readFile("src/db/migrations/meta/_journal.json", "utf8"),
            );
            const [migrationState] = await sql`
              SELECT count(*)::integer AS count
              FROM drizzle.__drizzle_migrations
            `;
            assert(migrationState.count === journal.entries.length, "upgrade did not apply every migration");

            const [artifact] = await sql`
              SELECT status::text AS status FROM ai_artifacts
              WHERE id = '00000000-0000-0000-0000-000000000801'
            `;
            assert(artifact?.status === "pending", "legacy artifact status was not mapped");

            const [cards] = await sql`
              SELECT
                count(*) FILTER (WHERE status = 'active')::integer AS active,
                count(*) FILTER (WHERE status = 'superseded')::integer AS superseded
              FROM learning_cards
              WHERE workspace_id = ${workspaceId} AND note_version_id = ${versionId}
            `;
            assert(cards.active === 1 && cards.superseded === 1, "active card duplicates were not converged");

            const [jobs] = await sql`
              SELECT
                count(*) FILTER (WHERE status = 'pending')::integer AS pending,
                count(*) FILTER (WHERE status = 'dead')::integer AS dead
              FROM jobs
              WHERE workspace_id = ${workspaceId}
                AND type = 'generate_card'
                AND payload->>'noteVersionId' = ${versionId}
            `;
            assert(jobs.pending === 1 && jobs.dead === 1, "active generate_card duplicates were not converged");

            const [events] = await sql`
              SELECT
                count(*) FILTER (WHERE job_id = ${evaluateJobId})::integer AS linked,
                count(*) FILTER (WHERE job_id IS NULL)::integer AS unlinked,
                count(*) FILTER (WHERE outcome = 'preliminary_understanding')::integer AS preliminary,
                count(*) FILTER (WHERE outcome = 'unclear_expression')::integer AS unclear
              FROM validation_events
              WHERE workspace_id = ${workspaceId}
            `;
            assert(
              events.linked === 1 && events.unlinked === 1 &&
                events.preliminary === 1 && events.unclear === 1,
              "validation event mapping/deduplication failed",
            );

            const [rls] = await sql`
              SELECT relrowsecurity, relforcerowsecurity
              FROM pg_class WHERE oid = 'notes'::regclass
            `;
            const [policy] = await sql`
              SELECT count(*)::integer AS count FROM pg_policy
              WHERE polrelid = 'notes'::regclass AND polname = 'notes_workspace_policy'
            `;
            assert(!rls.relrowsecurity && !rls.relforcerowsecurity && policy.count === 0, "unsafe RLS state survived upgrade");

            const indexes = await sql`
              SELECT indexrelid::regclass::text AS name
              FROM pg_index
              WHERE indisunique AND indexrelid::regclass::text = ANY(${[
                "learning_cards_workspace_note_version_active_unique_idx",
                "jobs_generate_card_active_unique_idx",
                "validation_events_job_unique_idx",
              ]})
            `;
            assert(indexes.length === 3, "one or more idempotency unique indexes are missing");
            console.log("representative 0012→latest migration invariants verified");
          } finally {
            await sql.end();
          }
          NODE

      - name: Re-run representative upgrade migrations
        working-directory: apps/api
        env:
          DATABASE_URL: ${{ env.UPGRADE_DATABASE_URL }}
          DATABASE_URL_MIGRATOR: ${{ env.UPGRADE_DATABASE_URL_MIGRATOR }}
        run: npm run db:migrate

  production-compose:
    name: Production Images & Compose Smoke
    runs-on: ubuntu-latest
    needs: [build, unit-tests, fresh-migrations]
    timeout-minutes: 35
    env:
      COMPOSE_PROJECT_NAME: ailearn_ci
      POSTGRES_USER: ailearn
      POSTGRES_PASSWORD: ci-compose-only-password
      POSTGRES_DB: ailearn
      MIGRATOR_PASSWORD: ci-compose-migrator-password
      API_PASSWORD: ci-compose-api-password
      WORKER_PASSWORD: ci-compose-worker-password
      DATABASE_URL_MIGRATOR: postgres://ailearn_migrator:ci-compose-migrator-password@postgres:5432/ailearn
      DATABASE_URL_API: postgres://ailearn_api:ci-compose-api-password@postgres:5432/ailearn
      DATABASE_URL_WORKER: postgres://ailearn_worker:ci-compose-worker-password@postgres:5432/ailearn
      CORS_ORIGIN: http://localhost:3000
      AI_PROVIDER_CARD: mock
      AI_CREDENTIAL_ENCRYPTION_KEY: 000102030405060708090a0b0c0d0e0f101112131415161718191a1b1c1d1e1f
      DOCKER_BUILDKIT: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Validate production and development Compose files
        run: |
          docker compose -f docker-compose.yml config --quiet
          docker compose -f docker-compose.dev.yml config --quiet

      # Keep these as three explicit steps so each production image is a
      # visible release gate rather than an implicit side effect of `up`.
      - name: Build API production image
        run: docker compose build api

      - name: Build Worker production image
        run: docker compose build worker

      - name: Build Web production image
        run: docker compose build web

      - name: Verify production images run as non-root
        run: |
          for image in ailearn_ci-api ailearn_ci-worker ailearn_ci-web; do
            user="$(docker image inspect "$image" --format '{{.Config.User}}')"
            test "$user" = "node" || {
              echo >&2 "$image must run as node, got: ${user:-root}"
              exit 1
            }
          done

      - name: Prepare migration image alias
        run: docker tag ailearn_ci-api ailearn_ci-migrate

      - name: Start production Compose stack without rebuilding
        run: docker compose up -d --no-build

      - name: Verify migration exit and service health
        run: |
          curl --fail --silent --show-error \
            --retry 30 --retry-delay 2 --retry-all-errors \
            http://127.0.0.1:4000/ready
          curl --fail --silent --show-error \
            --retry 30 --retry-delay 2 --retry-all-errors \
            http://127.0.0.1:3000/ >/dev/null

          for one_shot in role-bootstrap migrate role-grants; do
            container_id="$(docker compose ps -aq "$one_shot")"
            test -n "$container_id"
            test "$(docker inspect "$container_id" --format '{{.State.ExitCode}}')" = "0"
          done

          for service in postgres api worker web; do
            container_id="$(docker compose ps -q "$service")"
            test -n "$container_id" || {
              echo >&2 "$service has no running container"
              exit 1
            }
            test "$(docker inspect "$container_id" --format '{{.State.Running}}')" = "true"
          done

          docker compose ps -a

      - name: Seed worker smoke owner
        env:
          OWNER_EMAIL: worker-smoke@example.invalid
          OWNER_PASSWORD: ci-worker-smoke-password
          OWNER_WORKSPACE: CI Worker Smoke
        run: |
          docker compose exec -T \
            -e OWNER_EMAIL="$OWNER_EMAIL" \
            -e OWNER_PASSWORD="$OWNER_PASSWORD" \
            -e OWNER_WORKSPACE="$OWNER_WORKSPACE" \
            api npm run db:seed

      - name: Verify Worker claims and completes a mock job
        env:
          API_BASE_URL: http://127.0.0.1:4000
          WORKER_SMOKE_EMAIL: worker-smoke@example.invalid
          WORKER_SMOKE_PASSWORD: ci-worker-smoke-password
        run: node .github/scripts/verify-worker-smoke.mjs

      - name: Verify PostgreSQL backup can be restored
        env:
          RESTORE_DATABASE: ailearn_restore_ci
        run: |
          set -euo pipefail
          backup="$RUNNER_TEMP/ailearn-production-smoke.sql"
          trap 'rm -f "$backup"' EXIT

          docker compose exec -T postgres \
            pg_dump -U "$POSTGRES_USER" -d "$POSTGRES_DB" \
              --no-owner --no-privileges > "$backup"
          test -s "$backup"

          docker compose exec -T postgres \
            createdb -U "$POSTGRES_USER" "$RESTORE_DATABASE"
          docker compose exec -T postgres \
            psql -U "$POSTGRES_USER" -d "$RESTORE_DATABASE" \
              --set=ON_ERROR_STOP=1 < "$backup"

          # A restored database must receive the same production ownership and
          # least-privilege grants before an application process can use it.
          docker compose run --rm --no-deps \
            -e POSTGRES_DB="$RESTORE_DATABASE" \
            -e REQUIRE_RLS_DISABLED=true \
            role-grants

          tables=(
            users workspaces workspace_members notes note_versions
            learning_cards card_key_points jobs search_documents ai_audit_log
            user_ai_model_configs
          )
          for table in "${tables[@]}"; do
            source_count="$(docker compose exec -T postgres \
              psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -Atqc \
              "SELECT count(*) FROM \"$table\"")"
            restored_count="$(docker compose exec -T postgres \
              psql -U "$POSTGRES_USER" -d "$RESTORE_DATABASE" -Atqc \
              "SELECT count(*) FROM \"$table\"")"
            test "$restored_count" = "$source_count" || {
              echo >&2 "$table count mismatch: source=$source_count restored=$restored_count"
              exit 1
            }
            test "$restored_count" -gt 0 || {
              echo >&2 "$table was not populated by the production smoke fixture"
              exit 1
            }
          done

          source_migrations="$(docker compose exec -T postgres \
            psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -Atqc \
            'SELECT count(*) FROM drizzle.__drizzle_migrations')"
          restored_migrations="$(docker compose exec -T postgres \
            psql -U "$POSTGRES_USER" -d "$RESTORE_DATABASE" -Atqc \
            'SELECT count(*) FROM drizzle.__drizzle_migrations')"
          test "$restored_migrations" = "$source_migrations"
          test "$restored_migrations" -gt 0
          echo "backup/restore OK: $restored_migrations migrations and ${#tables[@]} populated tables"

      - name: Capture Compose diagnostics
        if: failure()
        run: |
          mkdir -p "$RUNNER_TEMP/compose-diagnostics"
          docker compose ps -a | tee "$RUNNER_TEMP/compose-diagnostics/ps.txt"
          docker compose logs --no-color --timestamps \
            2>&1 | tee "$RUNNER_TEMP/compose-diagnostics/compose.log"

      - name: Upload Compose diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: production-compose-diagnostics-${{ github.run_id }}
          path: ${{ runner.temp }}/compose-diagnostics
          if-no-files-found: warn
          retention-days: 7

      - name: Stop production Compose stack
        if: always()
        run: docker compose down --volumes --remove-orphans
