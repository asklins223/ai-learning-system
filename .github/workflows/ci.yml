name: CI

on:
  workflow_dispatch:
  schedule:
    # Nightly at 02:00 UTC — runs full nightly E2E suite (ADR-0008 §6)
    - cron: "0 2 * * *"
  push:
    branches: [main, master, "codex/**"]
    tags: ["v*"]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22"
  # Immutable v0.4 baseline named by the v0.5 release plan. Changed-line
  # coverage measures the complete v0.5 delta instead of an arbitrary runner
  # checkout depth or latest-commit window.
  COVERAGE_BASE_SHA: "33efa06f8c0a5f2d1e97e12dcb745b2314c606e8"

jobs:
  release-inputs:
    name: Clean Release Inputs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      # A release must be reproducible from Git alone. This also catches a
      # journal entry whose SQL file was left untracked in a local workspace.
      - name: Verify clean checkout and required release files
        run: node .github/scripts/verify-release-inputs.mjs

  typecheck:
    name: TypeCheck & Lint
    runs-on: ubuntu-latest
    needs: release-inputs
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          # Gitleaks scans the pushed commit range, which may include merge
          # parents that are unavailable in the default depth-1 checkout.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            package-lock.json
            apps/api/package-lock.json
            workers/ai-worker/package-lock.json
            packages/shared/package-lock.json
            packages/ai-quality/package-lock.json

      - name: Install repository tooling
        run: npm ci --no-audit --no-fund

      - name: Install shared
        working-directory: packages/shared
        run: npm ci --no-audit --no-fund

      - name: Install ai-quality
        working-directory: packages/ai-quality
        run: npm ci --no-audit --no-fund

      - name: Install API
        working-directory: apps/api
        run: npm ci --no-audit --no-fund

      - name: Install Worker
        working-directory: workers/ai-worker
        run: npm ci --no-audit --no-fund

      - name: Verify API and Worker database schemas are synchronized
        run: node .github/scripts/verify-schema-mirror.mjs

      - name: Verify CI workflow and PostgreSQL lifecycle contracts
        run: |
          node --test \
            .github/scripts/ci-workflow-contract.test.mjs \
            .github/scripts/postgres-integration-lifecycle.test.mjs

      - name: TypeCheck shared contracts
        working-directory: packages/shared
        run: npm run typecheck

      - name: TypeCheck ai-quality package
        working-directory: packages/ai-quality
        run: npm run typecheck

      - name: TypeCheck API
        working-directory: apps/api
        run: npm run typecheck

      - name: TypeCheck Worker
        working-directory: workers/ai-worker
        run: npm run typecheck

      # OPS-01: 验证 Prometheus alerts.yml 语法
      - name: Verify Prometheus alerts syntax
        run: node .github/scripts/verify-alerts-syntax.mjs

      # REL-01 / RC 硬门禁 §4.1: Secret scan — 0 high/critical 才通过
      # 使用 Gitleaks 扫描全仓，检测 API key、密码、token 等敏感信息泄漏。
      # .gitleaks.toml 配置允许 .env.example 和 docs/ 中的示例值。
      - name: Secret scan (Gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: true
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: false
          GITLEAKS_CONFIG: .gitleaks.toml

      # F-016: 生产依赖审计门禁 — 0 high/critical 才通过
      - name: Audit API production deps
        working-directory: apps/api
        run: npm audit --omit=dev --audit-level=high

      - name: Audit Worker production deps
        working-directory: workers/ai-worker
        run: npm audit --omit=dev --audit-level=high

      - name: Audit shared production deps
        working-directory: packages/shared
        run: npm audit --omit=dev --audit-level=high

  build:
    name: Build (API / Worker)
    runs-on: ubuntu-latest
    needs: typecheck
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            package-lock.json
            apps/api/package-lock.json
            workers/ai-worker/package-lock.json
            packages/shared/package-lock.json

      - name: Install shared
        working-directory: packages/shared
        run: npm ci --no-audit --no-fund

      - name: Install API
        working-directory: apps/api
        run: npm ci --no-audit --no-fund

      - name: Install Worker
        working-directory: workers/ai-worker
        run: npm ci --no-audit --no-fund

      # 真实 build 步骤 — 确保 API/Worker 产出文件
      - name: Build API
        working-directory: apps/api
        run: npm run build

      - name: Verify API build output
        working-directory: apps/api
        run: |
          test -f dist/server.cjs || {
            echo >&2 "API build failed: dist/server.cjs missing"
            exit 1
          }
          echo "API build OK"

      # G-002: Smoke test — 确保产物可被 Node 执行（防止 ESM/CJS 格式错误）
      - name: Smoke test API build
        working-directory: apps/api
        env:
          NODE_ENV: production
          DATABASE_URL_API: postgres://ailearn_api:ci-smoke-only@127.0.0.1:1/ailearn
        run: timeout 5 node dist/server.cjs || test $? -eq 124 && echo "API server started (timeout expected)"

      - name: Build Worker
        working-directory: workers/ai-worker
        run: npm run build

      - name: Verify Worker build output
        working-directory: workers/ai-worker
        run: |
          test -f dist/index.cjs || {
            echo >&2 "Worker build failed: dist/index.cjs missing"
            exit 1
          }
          echo "Worker build OK"

      # G-002: Smoke test — 确保产物可被 Node 执行
      - name: Smoke test Worker build
        working-directory: workers/ai-worker
        env:
          NODE_ENV: production
          DATABASE_URL_WORKER: postgres://ailearn_worker:ci-smoke-only@127.0.0.1:1/ailearn
        run: timeout 5 node dist/index.cjs || test $? -eq 124 && echo "Worker started (timeout expected)"

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: typecheck
    timeout-minutes: 15
    env:
      # Worker and API tests import db.ts at module load time, which creates
      # a postgres connection pool.  The pool is lazy (no connection is made
      # until a query runs), but the default URL uses the Docker Compose
      # hostname "postgres" which does not resolve on CI runners and can cause
      # DNS lookups to hang until the job timeout.  Setting these to a dummy
      # URL ensures the pool is created without hanging; all db methods are
      # mocked in unit tests so no real connection is ever attempted.
      DATABASE_URL_WORKER: postgres://ci:ci@127.0.0.1:1/ci
      DATABASE_URL_API: postgres://ci:ci@127.0.0.1:1/ci
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            apps/api/package-lock.json
            workers/ai-worker/package-lock.json
            packages/shared/package-lock.json

      - name: Prepare raw Node test evidence
        run: |
          mkdir -p "$RUNNER_TEMP/unit-test-logs"
          {
            node --version
            npm --version
            uname -a
            git rev-parse HEAD
          } > "$RUNNER_TEMP/unit-test-logs/environment.txt"

      - name: Install repository coverage tooling
        run: npm ci --no-audit --no-fund

      # API and Worker load the shared package from its workspace source path.
      # Install its runtime dependencies explicitly in a clean checkout so
      # imports such as zod resolve from packages/shared/node_modules.
      - name: Install shared
        working-directory: packages/shared
        run: npm ci --no-audit --no-fund

      - name: Install ai-quality
        working-directory: packages/ai-quality
        run: npm ci --no-audit --no-fund

      - name: Run shared contract unit tests
        working-directory: packages/shared
        run: |
          set -o pipefail
          npm test 2>&1 | tee "$RUNNER_TEMP/unit-test-logs/shared.tap"

      # AIQ-01: 版本化黄金集与评分器单元测试
      - name: Run ai-quality unit tests
        working-directory: packages/ai-quality
        run: |
          set -o pipefail
          npm test 2>&1 | tee "$RUNNER_TEMP/unit-test-logs/ai-quality.tap"

      - name: Run API unit tests
        working-directory: apps/api
        run: |
          npm ci --no-audit --no-fund
          set -o pipefail
          npm test 2>&1 | tee "$RUNNER_TEMP/unit-test-logs/api.tap"

      - name: Run Worker unit tests
        working-directory: workers/ai-worker
        run: |
          npm ci --no-audit --no-fund
          set -o pipefail
          npm test 2>&1 | tee "$RUNNER_TEMP/unit-test-logs/worker.tap"

      # QLT-01/02: skip/todo allowlist gate (ADR-0008 §覆盖率与测试发现)
      - name: Skip/todo allowlist gate
        run: |
          set -o pipefail
          node .github/scripts/skip-todo-gate.mjs 2>&1 | tee "$RUNNER_TEMP/unit-test-logs/skip-todo-gate.txt"

      # QLT-01/02: coverage collection (report-only in PR, enforced in release-check)
      - name: Coverage gate (report-only)
        run: |
          set -o pipefail
          node .github/scripts/coverage-gate.mjs --report-only 2>&1 | tee "$RUNNER_TEMP/unit-test-logs/coverage-gate.txt"
          # Include coverage summary JSON in the artifact for FDN-01 formal report
          if [ -f outputs/coverage/summary.json ]; then
            cp outputs/coverage/summary.json "$RUNNER_TEMP/unit-test-logs/coverage-summary.json"
          fi
          find outputs/coverage -maxdepth 1 -name '*.coverage.json' -exec \
            cp {} "$RUNNER_TEMP/unit-test-logs/" \;

      - name: Upload raw Node test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: node-${{ env.NODE_VERSION }}-unit-test-logs-${{ github.sha }}
          path: ${{ runner.temp }}/unit-test-logs
          if-no-files-found: warn
          retention-days: 30

  # AIQ-01: PR 层 AI 质量门禁（ADR-0005）
  # PR 只运行 schema/parser/alignment/scorer 与固定 Mock，不访问付费网络。
  # 校验数据集完整性、标签覆盖、评分器逻辑和 metricsVerified。
  ai-quality-gate:
    name: AI Quality Gate (PR Mock, ADR-0005)
    runs-on: ubuntu-latest
    needs: typecheck
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            packages/shared/package-lock.json
            packages/ai-quality/package-lock.json

      - name: Install shared
        working-directory: packages/shared
        run: npm ci --no-audit --no-fund

      - name: Install ai-quality
        working-directory: packages/ai-quality
        run: npm ci --no-audit --no-fund

      - name: Run PR Mock quality gate
        working-directory: packages/ai-quality
        run: |
          set -o pipefail
          mkdir -p "$RUNNER_TEMP/ai-quality-evidence"
          npm run pr-gate 2>&1 | tee "$RUNNER_TEMP/ai-quality-evidence/pr-gate-result.json"

      - name: Upload AI quality gate evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-quality-pr-gate-${{ github.sha }}
          path: ${{ runner.temp }}/ai-quality-evidence
          if-no-files-found: warn
          retention-days: 90

  fresh-migrations:
    name: Fresh PostgreSQL Migrations
    runs-on: ubuntu-latest
    needs: typecheck
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ailearn
          POSTGRES_PASSWORD: ci-migration-only-password
          POSTGRES_DB: ailearn_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ailearn -d ailearn_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL: postgres://ailearn:ci-migration-only-password@127.0.0.1:5432/ailearn_ci
      DATABASE_URL_MIGRATOR: postgres://ailearn_migrator:ci-migrator-only-password@127.0.0.1:5432/ailearn_ci
      DATABASE_URL_API: postgres://ailearn_api:ci-api-only-password@127.0.0.1:5432/ailearn_ci
      DATABASE_URL_WORKER: postgres://ailearn_worker:ci-worker-only-password@127.0.0.1:5432/ailearn_ci
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_USER: ailearn
      POSTGRES_PASSWORD: ci-migration-only-password
      POSTGRES_DB: ailearn_ci
      MIGRATOR_PASSWORD: ci-migrator-only-password
      API_PASSWORD: ci-api-only-password
      WORKER_PASSWORD: ci-worker-only-password
      NODE_ENV: production
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            apps/api/package-lock.json
            workers/ai-worker/package-lock.json
            packages/shared/package-lock.json

      - name: Prepare raw PostgreSQL test evidence
        run: |
          mkdir -p "$RUNNER_TEMP/postgres-test-logs"
          {
            node --version
            npm --version
            uname -a
            git rev-parse HEAD
            docker inspect "${{ job.services.postgres.id }}" \
              --format '{{.Config.Image}} {{.Image}}'
          } > "$RUNNER_TEMP/postgres-test-logs/environment.txt"

      - name: Install shared
        working-directory: packages/shared
        run: npm ci --no-audit --no-fund

      - name: Install API
        working-directory: apps/api
        # NODE_ENV=production would otherwise omit tsx, which db:migrate uses.
        run: npm ci --include=dev --no-audit --no-fund

      - name: Install Worker
        working-directory: workers/ai-worker
        run: npm ci --include=dev --no-audit --no-fund

      - name: Bootstrap least-privilege roles for the empty database
        run: |
          docker run --rm --network host \
            -v "$PWD/infra/postgres:/opt/ailearn:ro" \
            -e POSTGRES_HOST -e POSTGRES_USER -e POSTGRES_PASSWORD -e POSTGRES_DB \
            -e MIGRATOR_PASSWORD -e API_PASSWORD -e WORKER_PASSWORD \
            postgres:16-alpine /bin/sh /opt/ailearn/apply-roles.sh

      - name: Migrate an empty database
        working-directory: apps/api
        run: npm run db:migrate

      - name: Re-run migrations (idempotence)
        working-directory: apps/api
        run: npm run db:migrate

      # 2026-08-11（测试质量修复）：db-commit-port/db-migrations 原以 .test.ts
      # 命名被默认测试拾取，但单元 job 的 DATABASE_URL 指向不可达 DB（127.0.0.1:1）
      # 导致永远静默 skip。改名 .integration.ts 后在此（真实 postgres 服务）接入。
      - name: Verify commit port + migration idempotence against real PostgreSQL
        working-directory: apps/api
        env:
          NODE_ENV: test
          DATABASE_URL_API: ${{ env.DATABASE_URL_API }}
        run: |
          set -o pipefail
          node --import tsx --test --test-concurrency=1 \
            src/integration-tests/db-commit-port.integration.ts \
            src/integration-tests/db-migrations.integration.ts \
            2>&1 | tee "$RUNNER_TEMP/postgres-test-logs/commit-port-migrations.tap"

      - name: Apply and verify empty-database role grants
        env:
          REQUIRE_RLS_DISABLED: "true"
        run: |
          docker run --rm --network host \
            -v "$PWD/infra/postgres:/opt/ailearn:ro" \
            -e POSTGRES_HOST -e POSTGRES_USER -e POSTGRES_PASSWORD -e POSTGRES_DB \
            -e MIGRATOR_PASSWORD -e API_PASSWORD -e WORKER_PASSWORD \
            -e REQUIRE_RLS_DISABLED \
            postgres:16-alpine /bin/sh /opt/ailearn/apply-roles.sh

      - name: Verify shared PostgreSQL auth rate limiting
        working-directory: apps/api
        env:
          NODE_ENV: test
          RATE_LIMIT_TEST_DATABASE_URL: ${{ env.DATABASE_URL_API }}
        run: |
          set -o pipefail
          node --import tsx --test src/integration-tests/rate-limit-postgres.integration.ts \
            2>&1 | tee "$RUNNER_TEMP/postgres-test-logs/rate-limit.tap"

      - name: Verify SEC-01 policy catalog and restricted roles
        working-directory: apps/api
        env:
          NODE_ENV: test
          RLS_TEST_MIGRATOR_DATABASE_URL: ${{ env.DATABASE_URL_MIGRATOR }}
          RLS_TEST_API_DATABASE_URL: ${{ env.DATABASE_URL_API }}
          RLS_TEST_WORKER_DATABASE_URL: ${{ env.DATABASE_URL_WORKER }}
        run: |
          set -o pipefail
          node --import tsx --test src/integration-tests/rls-policies-postgres.integration.ts \
            2>&1 | tee "$RUNNER_TEMP/postgres-test-logs/rls-policies.tap"

      - name: Verify content hash consistency between PostgreSQL and application layer
        working-directory: apps/api
        env:
          NODE_ENV: test
          CONTENT_HASH_TEST_DATABASE_URL: ${{ env.DATABASE_URL_API }}
        run: |
          set -o pipefail
          node --import tsx --test src/integration-tests/content-hash-consistency-postgres.integration.ts \
            2>&1 | tee "$RUNNER_TEMP/postgres-test-logs/content-hash-consistency.tap"

      - name: Verify SEC-02 invite/onboarding schema, constraints, and RLS
        working-directory: apps/api
        env:
          NODE_ENV: test
          SEC02_TEST_DATABASE_URL: ${{ env.DATABASE_URL_API }}
        run: |
          set -o pipefail
          node --import tsx --test src/integration-tests/sec02-invites-onboarding-postgres.integration.ts \
            2>&1 | tee "$RUNNER_TEMP/postgres-test-logs/sec02-invites-onboarding.tap"

      - name: Verify note version restore schema, constraints, and cascade behaviour
        working-directory: apps/api
        env:
          NODE_ENV: test
          NOTE_VERSION_RESTORE_TEST_DATABASE_URL: ${{ env.DATABASE_URL_API }}
        run: |
          set -o pipefail
          node --import tsx --test src/integration-tests/note-version-restore-postgres.integration.ts \
            2>&1 | tee "$RUNNER_TEMP/postgres-test-logs/note-version-restore.tap"

      # 双空间 · 双角色的行为契约。存在的理由：sec01-cross-workspace-isolation 与
      # permission-guard 都是源码字符串包含断言，摘掉某个路由的 requireOwner 不会变红；
      # 这一份走真实 invite 流程产出 member，用 HTTP 断言 403/404 与投影一致性。
      # 必须用受限角色（ailearn_api 是 NOBYPASSRLS），超级用户会绕过 RLS。
      - name: Verify collaborative workspace roles and cross-workspace isolation behaviour
        working-directory: apps/api
        env:
          NODE_ENV: test
          DATABASE_URL_MIGRATOR: ${{ env.DATABASE_URL_MIGRATOR }}
          DATABASE_URL_API: ${{ env.DATABASE_URL_API }}
        run: |
          set -o pipefail
          node --import tsx --test src/integration-tests/workspace-collab-postgres.integration.ts \
            2>&1 | tee "$RUNNER_TEMP/postgres-test-logs/workspace-collab.tap"

      # 笔记协同内核（批次 4.1/4.2）：文档快照是正文的唯一事实源（补齐/投影/revision
      # 单调/组合外键/RLS 换角色才测得出来），以及 WS 通道的鉴权（只读连接收到
      # Authenticated("readonly")、上送被否定且不落库、被拒的理由不泄露笔记存在性、
      # 关停刷 debounce 窗口）。两份此前都没有接入 CI——不接就等于不存在。
      - name: Verify note document state and collaboration authorization behaviour
        working-directory: apps/api
        env:
          NODE_ENV: test
          DATABASE_URL_MIGRATOR: ${{ env.DATABASE_URL_MIGRATOR }}
          DATABASE_URL_API: ${{ env.DATABASE_URL_API }}
        run: |
          set -o pipefail
          node --import tsx --test --test-concurrency=1 \
            src/integration-tests/note-document-state-postgres.integration.ts \
            src/integration-tests/note-collaboration-postgres.integration.ts \
            2>&1 | tee "$RUNNER_TEMP/postgres-test-logs/note-collaboration.tap"

      # 空间隔离 schema 棘轮：把当前"带 workspace_id 但缺外键 / 缺 RLS"的表如实登记为
      # 基线，要求实际集合与基线完全相等——新增违规变红，修好一条也必须同步删基线，
      # 所以清单只能缩短。一次性补齐 89 个外键不现实，用棘轮换"不再恶化"。
      - name: Verify workspace schema ratchet (FK and RLS coverage cannot regress)
        working-directory: apps/api
        env:
          NODE_ENV: test
          DATABASE_URL_API: ${{ env.DATABASE_URL_API }}
        run: |
          set -o pipefail
          node --import tsx --test src/integration-tests/schema-isolation-gate-postgres.integration.ts \
            2>&1 | tee "$RUNNER_TEMP/postgres-test-logs/schema-isolation-gate.tap"

      # Companion 首页房间档案：0185 RLS 隔离 + 真实 SQL revision CAS（含并发
      # 写入者竞争）+ PATCH /companion/room-profile 的 400/409/200 认证契约。
      # 该文件此前未接入任何 CI job，只会在缺 URL 时静默 skip。
      # 必须使用受限角色：超级用户会绕过 RLS，ailearn_api 是 NOBYPASSRLS。
      - name: Verify companion home profile RLS, revision CAS, and HTTP contract
        working-directory: apps/api
        env:
          NODE_ENV: test
          DATABASE_URL_MIGRATOR: ${{ env.DATABASE_URL_MIGRATOR }}
          DATABASE_URL_API: ${{ env.DATABASE_URL_API }}
        run: |
          set -o pipefail
          npm run test:companion-home-profile:postgres \
            2>&1 | tee "$RUNNER_TEMP/postgres-test-logs/companion-home-profile.tap"

      # Companion 集成矩阵：对话（turn/幂等/SSE/导出）、记忆（provenance/冲突/
      # 星图）、交付（inbox/lease/ack/kind 约束）、旅程/沙箱、工具网关提案执行。
      # 16 个套件此前只存在于仓库里、没有任何 CI job 或 make 目标会运行它们；
      # 其中 assistant-deliveries-kind-constraint 锁死「代码 kind 集合 == 库约束」，
      # 防止 0131 漏 memory_candidate 那类「写入即回滚」的漂移再次发生。
      # 必须使用受限角色：超级用户会绕过 RLS，让隔离断言假通过。
      - name: Verify companion integration matrix (dialogue, memory, delivery, journey, tool gateway)
        working-directory: apps/api
        env:
          NODE_ENV: test
          DATABASE_URL_MIGRATOR: ${{ env.DATABASE_URL_MIGRATOR }}
          DATABASE_URL_API: ${{ env.DATABASE_URL_API }}
          DATABASE_URL_WORKER: ${{ env.DATABASE_URL_WORKER }}
        run: |
          set -o pipefail
          npm run test:companion-integration:postgres \
            2>&1 | tee "$RUNNER_TEMP/postgres-test-logs/companion-integration.tap"

      # Companion worker 侧：agent bounded loop（工具调用→proposal→waiting_for_
      # confirmation）与 dialogue 落库/终态；此前同样没有任何 CI job 运行。
      - name: Verify companion worker agent loop and dialogue persistence
        working-directory: workers/ai-worker
        env:
          NODE_ENV: test
          DATABASE_URL_MIGRATOR: ${{ env.DATABASE_URL_MIGRATOR }}
          DATABASE_URL_API: ${{ env.DATABASE_URL_API }}
          DATABASE_URL_WORKER: ${{ env.DATABASE_URL_WORKER }}
        run: |
          set -o pipefail
          npm run test:companion-integration:postgres \
            2>&1 | tee "$RUNNER_TEMP/postgres-test-logs/companion-worker.tap"

      - name: Verify double Worker queue, leases, and pool context
        working-directory: workers/ai-worker
        env:
          NODE_ENV: test
          QUEUE_TEST_MIGRATOR_DATABASE_URL: ${{ env.DATABASE_URL_MIGRATOR }}
          QUEUE_TEST_WORKER_A_DATABASE_URL: ${{ env.DATABASE_URL_WORKER }}
          QUEUE_TEST_WORKER_B_DATABASE_URL: ${{ env.DATABASE_URL_WORKER }}
        run: |
          set -o pipefail
          node --import tsx --test src/integration-tests/queue-postgres.integration.ts \
            2>&1 | tee "$RUNNER_TEMP/postgres-test-logs/worker-queue.tap"

      - name: Verify every journal migration was applied
        working-directory: apps/api
        run: |
          node --input-type=module <<'NODE'
          import { readFile } from "node:fs/promises";
          import postgres from "postgres";

          const journal = JSON.parse(
            await readFile("src/db/migrations/meta/_journal.json", "utf8"),
          );
          const sql = postgres(process.env.DATABASE_URL, { max: 1 });
          try {
            const [{ count }] = await sql`
              SELECT count(*)::integer AS count
              FROM drizzle.__drizzle_migrations
            `;
            if (Number(count) !== journal.entries.length) {
              throw new Error(
                `migration count mismatch: database=${count}, journal=${journal.entries.length}`,
              );
            }
            console.log(`all ${count} migrations are recorded`);
          } finally {
            await sql.end();
          }
          NODE

      - name: Upload raw PostgreSQL test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: postgres-16-sec01-test-logs-${{ github.sha }}
          path: ${{ runner.temp }}/postgres-test-logs
          if-no-files-found: warn
          retention-days: 30

  production-compose:
    name: Production Images & Compose Smoke
    runs-on: ubuntu-latest
    needs: [build, unit-tests, fresh-migrations]
    timeout-minutes: 35
    env:
      COMPOSE_PROJECT_NAME: ailearn_ci
      POSTGRES_USER: ailearn
      POSTGRES_PASSWORD: ci-compose-only-password
      POSTGRES_DB: ailearn
      MIGRATOR_PASSWORD: ci-compose-migrator-password
      API_PASSWORD: ci-compose-api-password
      WORKER_PASSWORD: ci-compose-worker-password
      DATABASE_URL_MIGRATOR: postgres://ailearn_migrator:ci-compose-migrator-password@postgres:5432/ailearn
      DATABASE_URL_API: postgres://ailearn_api:ci-compose-api-password@postgres:5432/ailearn
      DATABASE_URL_WORKER: postgres://ailearn_worker:ci-compose-worker-password@postgres:5432/ailearn
      CORS_ORIGIN: ""
      # compose 强制 ${EDGE_TTS_AUTH_TOKEN:?} 插值；CI 必须提供（api 与 edge-tts 一致）
      EDGE_TTS_AUTH_TOKEN: ci-edge-tts-token
      WORKER_METRICS_PORT: "9100"
      DOCKER_BUILDKIT: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Validate production and development Compose files
        run: |
          docker compose -f docker-compose.yml config --quiet
          docker compose -f docker-compose.dev.yml config --quiet

      # Keep these as explicit steps so each production image is a
      # visible release gate rather than an implicit side effect of `up`.
      - name: Build API production image
        run: docker compose build api

      - name: Build Worker production image
        run: docker compose build worker

      - name: Build edge-tts production image
        # 2026-08-11 修复：此前未构建 edge-tts，后续 `up -d --no-build` 会因
        # 镜像缺失失败，且该镜像从不被 Trivy 扫描。
        run: docker compose build edge-tts

      - name: Verify production images run as non-root
        run: |
          for image in ailearn_ci-api ailearn_ci-worker ailearn_ci-edge-tts; do
            user="$(docker image inspect "$image" --format '{{.Config.User}}')"
            case "$image" in
              *edge-tts) expected="nobody" ;;
              *) expected="node" ;;
            esac
            test "$user" = "$expected" || {
              echo >&2 "$image must run as $expected, got: ${user:-root}"
              exit 1
            }
          done

      # REL-01 / RC 硬门禁 §4.1: 镜像漏洞扫描 — 0 high/critical 才通过
      # 使用 Trivy 扫描生产 Docker 镜像的高危和严重漏洞。
      # --severity HIGH,CRITICAL --exit-code 1 确保有高危漏洞时阻断 CI。
      - name: Scan API image for vulnerabilities (Trivy)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ailearn_ci-api
          severity: HIGH,CRITICAL
          exit-code: '1'
          format: table
          ignore-unfixed: true

      - name: Scan Worker image for vulnerabilities (Trivy)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ailearn_ci-worker
          severity: HIGH,CRITICAL
          exit-code: '1'
          format: table
          ignore-unfixed: true

      - name: Scan edge-tts image for vulnerabilities (Trivy)
        # 2026-08-11 修复：edge-tts 镜像此前从不被扫描（python:3.12-slim 基础镜像）
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ailearn_ci-edge-tts
          severity: HIGH,CRITICAL
          exit-code: '1'
          format: table
          ignore-unfixed: true

      # Capture local build identities for reproducibility. These are not
      # registry RepoDigests and therefore cannot satisfy the release contract.
      - name: Capture local production image identities (REL-01 evidence)
        env:
          COMPOSE_PROJECT_NAME: ${{ env.COMPOSE_PROJECT_NAME }}
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: |
          mkdir -p "$RUNNER_TEMP/image-digests"
          node .github/scripts/capture-image-digests.mjs \
            --allow-local \
            --output "$RUNNER_TEMP/image-digests/image-digests.json"

      - name: Upload image digests artifact
        uses: actions/upload-artifact@v4
        with:
          name: image-digests-${{ github.sha }}
          path: ${{ runner.temp }}/image-digests
          if-no-files-found: error
          retention-days: 30

      - name: Prepare migration image alias
        run: docker tag ailearn_ci-api ailearn_ci-migrate

      - name: Use mock AI platform config for CI
        run: |
          mkdir -p config
          cp .github/ci/ai-platforms.mock.json config/ai-platforms.json

      - name: Start production Compose stack without rebuilding
        run: docker compose up -d --no-build

      - name: Verify migration exit and service health
        run: |
          curl --fail --silent --show-error \
            --retry 30 --retry-delay 2 --retry-all-errors \
            http://127.0.0.1:4000/ready

      - name: Verify Worker metrics server is running
        run: |
          curl --fail --silent --show-error \
            --retry 30 --retry-delay 2 --retry-all-errors \
            http://127.0.0.1:9100/metrics | head -1 || {
            echo "Worker metrics server not accessible"
            exit 1
          }

          for one_shot in role-bootstrap migrate role-grants; do
            container_id="$(docker compose ps -aq "$one_shot")"
            test -n "$container_id"
            test "$(docker inspect "$container_id" --format '{{.State.ExitCode}}')" = "0"
          done

          for service in postgres api worker; do
            container_id="$(docker compose ps -q "$service")"
            test -n "$container_id" || {
              echo >&2 "$service has no running container"
              exit 1
            }
            test "$(docker inspect "$container_id" --format '{{.State.Running}}')" = "true"
          done

          docker compose ps -a

      - name: Verify PostgreSQL backup can be restored
        env:
          RESTORE_DATABASE: ailearn_restore_ci
        run: |
          set -euo pipefail
          backup="$RUNNER_TEMP/ailearn-production-smoke.sql"
          trap 'rm -f "$backup"' EXIT

          # Freeze application writers before taking and comparing the dump.
          # Otherwise a follow-up indexing job can legitimately change the
          # source database after pg_dump's consistent snapshot was captured.
          docker compose stop api worker

          docker compose exec -T postgres \
            pg_dump -U "$POSTGRES_USER" -d "$POSTGRES_DB" \
              --no-owner --no-privileges > "$backup"
          test -s "$backup"

          docker compose exec -T postgres \
            createdb -U "$POSTGRES_USER" "$RESTORE_DATABASE"
          docker compose exec -T postgres \
            psql -U "$POSTGRES_USER" -d "$RESTORE_DATABASE" \
              --set=ON_ERROR_STOP=1 < "$backup"

          # A restored database must receive the same production ownership and
          # least-privilege grants before an application process can use it.
          docker compose run --rm --no-deps \
            -e POSTGRES_DB="$RESTORE_DATABASE" \
            -e REQUIRE_RLS_DISABLED=true \
            role-grants

          tables=(
            users workspaces workspace_members notes note_versions
            note_blocks sources source_segments jobs search_documents ai_audit_log
            learning_objectives_v2 learning_cards_v2
            evidence_snapshots_v2
          )
          for table in "${tables[@]}"; do
            source_count="$(docker compose exec -T postgres \
              psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -Atqc \
              "SELECT count(*) FROM \"$table\"")"
            restored_count="$(docker compose exec -T postgres \
              psql -U "$POSTGRES_USER" -d "$RESTORE_DATABASE" -Atqc \
              "SELECT count(*) FROM \"$table\"")"
            test "$restored_count" = "$source_count" || {
              echo >&2 "$table count mismatch: source=$source_count restored=$restored_count"
              exit 1
            }
          done

          source_migrations="$(docker compose exec -T postgres \
            psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -Atqc \
            'SELECT count(*) FROM drizzle.__drizzle_migrations')"
          restored_migrations="$(docker compose exec -T postgres \
            psql -U "$POSTGRES_USER" -d "$RESTORE_DATABASE" -Atqc \
            'SELECT count(*) FROM drizzle.__drizzle_migrations')"
          test "$restored_migrations" = "$source_migrations"
          test "$restored_migrations" -gt 0
          echo "backup/restore OK: $restored_migrations migrations and ${#tables[@]} populated tables"

      - name: Privacy scan on /metrics endpoint (ADR-0006 §7)
        env:
          METRICS_URL: "http://localhost:4000/metrics"
        run: |
          set -euo pipefail
          # Restart API to expose /metrics endpoint
          docker compose start api
          # Wait for readiness
          for i in $(seq 1 30); do
            if curl -sf http://localhost:4000/ready >/dev/null 2>&1; then
              break
            fi
            sleep 2
          done
          # Fetch metrics and run privacy scan
          METRICS_TEXT=$(curl -sf "$METRICS_URL" || echo "")
          if [ -z "$METRICS_TEXT" ]; then
            echo "Warning: /metrics endpoint returned empty, skipping privacy scan"
          else
            node --import tsx apps/api/src/scripts/privacy-scan.ts --text "$METRICS_TEXT"
          fi

      - name: Backup scripts test (ADR-0007)
        run: |
          bash infra/backup/backup-scripts.test.sh

      - name: Capture Compose diagnostics
        if: failure()
        run: |
          mkdir -p "$RUNNER_TEMP/compose-diagnostics"
          docker compose ps -a | tee "$RUNNER_TEMP/compose-diagnostics/ps.txt"
          docker compose logs --no-color --timestamps \
            2>&1 | tee "$RUNNER_TEMP/compose-diagnostics/compose.log"

      - name: Upload Compose diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: production-compose-diagnostics-${{ github.run_id }}
          path: ${{ runner.temp }}/compose-diagnostics
          if-no-files-found: warn
          retention-days: 7

      - name: Stop production Compose stack
        if: always()
        run: docker compose down --volumes --remove-orphans

  release-evidence:
    name: Release Evidence (Manifest Aggregation)
    runs-on: ubuntu-latest
    needs: [build, unit-tests, fresh-migrations, production-compose, ai-quality-gate]
    # Don't run on PRs from forks (secrets may not be available)
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      # Install shared for manifest generator (it imports version-contract.mjs)
      - name: Install shared
        working-directory: packages/shared
        run: npm ci --no-audit --no-fund

      - name: Prepare release evidence directory
        run: mkdir -p "$RUNNER_TEMP/release-evidence"

      # Download the image digests artifact produced by production-compose.
      # This contains local build identities, or registry RepoDigests when a
      # separate publish stage has supplied them.
      - name: Download image digests artifact
        uses: actions/download-artifact@v4
        with:
          name: image-digests-${{ github.sha }}
          path: ${{ runner.temp }}/image-digests

      - name: Check for image digests
        id: check-images
        run: |
          if [ -f "$RUNNER_TEMP/image-digests/image-digests.json" ] \
            && jq -e '.releaseReady == true' "$RUNNER_TEMP/image-digests/image-digests.json" >/dev/null; then
            echo "images_path=$RUNNER_TEMP/image-digests/image-digests.json" >> "$GITHUB_OUTPUT"
            echo "Found registry-backed image digests file"
          else
            echo "images_path=" >> "$GITHUB_OUTPUT"
            echo "Local image identities are evidence only; registry RepoDigests remain required"
          fi

      - name: Download raw unit and coverage evidence
        uses: actions/download-artifact@v4
        with:
          name: node-${{ env.NODE_VERSION }}-unit-test-logs-${{ github.sha }}
          path: ${{ runner.temp }}/unit-test-logs

      - name: Prepare collected coverage and scan evidence
        run: |
          test -f "$RUNNER_TEMP/unit-test-logs/coverage-summary.json"
          mkdir -p outputs/coverage "$RUNNER_TEMP/release-evidence/scan-results"
          cp "$RUNNER_TEMP/unit-test-logs/coverage-summary.json" outputs/coverage/summary.json
          cp outputs/coverage/summary.json "$RUNNER_TEMP/release-evidence/coverage-summary.json"
          find "$RUNNER_TEMP/unit-test-logs" -maxdepth 1 -name '*.coverage.json' -exec \
            cp {} outputs/coverage/ \;
          for name in api worker; do
            echo "passed: production-compose Trivy gate completed with exit-code=0" \
              > "$RUNNER_TEMP/release-evidence/scan-results/trivy-scan-${name}.txt"
          done
          for name in api worker shared; do
            echo "passed: typecheck npm audit gate completed with exit-code=0" \
              > "$RUNNER_TEMP/release-evidence/scan-results/npm-audit-${name}.txt"
          done

      # Generate dev manifest (with test summary) for evidence retention
      - name: Generate release manifest (dev mode)
        run: |
          set -o pipefail
          node .github/scripts/release-manifest-generate.mjs \
            --skip-tests \
            --output "$RUNNER_TEMP/release-evidence/release-manifest-dev.json" \
            2>&1 | tee "$RUNNER_TEMP/release-evidence/generate-dev.log"

      # Generate RC manifest with real image digests (if available).
      # The --images flag injects canonical sha256 digests from the CI build
      # into the manifest.images section, replacing placeholder values.
      - name: Generate release manifest (RC with image digests)
        run: |
          set -o pipefail
          IMAGES_ARG=""
          if [ -n "${{ steps.check-images.outputs.images_path }}" ]; then
            IMAGES_ARG="--images ${{ steps.check-images.outputs.images_path }}"
          fi
          node .github/scripts/release-manifest-generate.mjs \
            --rc \
            --skip-tests \
            $IMAGES_ARG \
            --output "$RUNNER_TEMP/release-evidence/release-manifest-rc.json" \
            2>&1 | tee "$RUNNER_TEMP/release-evidence/generate-rc.log"

      # Record environment metadata for reproducibility
      - name: Record evidence metadata
        run: |
          {
            echo "{"
            echo "  \"githubRunId\": \"${{ github.run_id }}\","
            echo "  \"githubRunAttempt\": \"${{ github.run_attempt }}\","
            echo "  \"githubSha\": \"${{ github.sha }}\","
            echo "  \"githubRef\": \"${{ github.ref }}\","
            echo "  \"githubEventName\": \"${{ github.event_name }}\","
            echo "  \"nodeVersion\": \"$(node --version)\","
            echo "  \"npmVersion\": \"$(npm --version)\","
            echo "  \"uname\": \"$(uname -a)\","
            echo "  \"generatedAt\": \"$(date -u +%Y-%m-%dT%H:%M:%SZ)\""
            echo "}"
          } > "$RUNNER_TEMP/release-evidence/environment.json"

      # FDN-01: Save formal coverage baseline with digest for reproducibility
      - name: Save coverage baseline (FDN-01)
        run: |
          mkdir -p "$RUNNER_TEMP/release-evidence/coverage-baseline"
          node .github/scripts/coverage-baseline-save.mjs \
            --use-existing \
            --label "ci-${{ github.run_id }}" \
            2>&1 | tee "$RUNNER_TEMP/release-evidence/coverage-baseline-save.log"
          cp -R outputs/coverage-baselines/. \
            "$RUNNER_TEMP/release-evidence/coverage-baseline/"

      # Run only after aggregation so an exact tag is checked against concrete
      # test/scan/image/AIQ/approval evidence instead of failing before jobs run.
      # 2026-08-11：无 registry 凭据时（本 workflow 从不 push GHCR），images
      # 门禁降级为显式声明 --allow-unpublished-images（占位 digest 放行，其余
      # 校验照常严格）；正式 release 在带 registry push 的流程以严格模式校验。
      - name: Verify exact-tag release manifest contract
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          RELEASE_MANIFEST_PATH: ${{ runner.temp }}/release-evidence/release-manifest-rc.json
        run: |
          EXTRA=""
          if [ -z "${{ steps.check-images.outputs.images_path }}" ]; then
            EXTRA="--allow-unpublished-images"
          fi
          node .github/scripts/release-manifest-contract.mjs $EXTRA

      - name: Upload release evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-evidence-${{ github.sha }}
          path: ${{ runner.temp }}/release-evidence
          if-no-files-found: warn
          retention-days: 90
+  alpha-infrastructure:
    name: Alpha Infrastructure (Monitoring + Backup, OPS-01)
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    timeout-minutes: 45
    env:
      COMPOSE_PROJECT_NAME: ailearn_alpha_ci
      POSTGRES_USER: ailearn
      POSTGRES_PASSWORD: ci-alpha-postgres-password
      POSTGRES_DB: ailearn
      MIGRATOR_PASSWORD: ci-alpha-migrator-password
      API_PASSWORD: ci-alpha-api-password
      WORKER_PASSWORD: ci-alpha-worker-password
      DATABASE_URL_MIGRATOR: postgres://ailearn_migrator:ci-alpha-migrator-password@postgres:5432/ailearn
      DATABASE_URL_API: postgres://ailearn_api:ci-alpha-api-password@postgres:5432/ailearn
      DATABASE_URL_WORKER: postgres://ailearn_worker:ci-alpha-worker-password@postgres:5432/ailearn
      MINIO_ROOT_USER: ailearn
      MINIO_ROOT_PASSWORD: ci-alpha-minio-secret
      BACKUP_BUCKET: ailearn-backups
      SOURCE_RELEASE: "0.5.0-alpha"
      SOURCE_COMMIT: ${{ github.sha }}
      # SOURCE_MIGRATION 不再硬编码（此前 "0039" 已过期到 0103+）：
      # alpha-env-setup.sh 从 _journal.json 动态取最新迁移号。
      CORS_ORIGIN: ""
      AUTH_COOKIE_SECURE: "false"
      # compose 强制 ${EDGE_TTS_AUTH_TOKEN:?} 插值
      EDGE_TTS_AUTH_TOKEN: ci-edge-tts-token
    steps:
      - uses: actions/checkout@v4

      - name: Validate Docker Compose alpha overlay
        run: |
          docker compose -f docker-compose.yml -f docker-compose.alpha.yml --profile storage config --quiet

      - name: Use mock AI platform config for CI
        run: |
          mkdir -p config
          cp .github/ci/ai-platforms.mock.json config/ai-platforms.json

      - name: Start complete Alpha stack
        run: ./scripts/alpha-env-setup.sh up

      - name: Initialize backup infrastructure (age keys + S3 bucket)
        run: ./scripts/alpha-env-setup.sh init

      - name: Execute RC restore verification
        run: ./scripts/alpha-env-setup.sh restore-verify

      - name: Verify deeply checked backup freshness
        run: ./scripts/alpha-env-setup.sh freshness

      - name: Verify Prometheus rules, targets, and backup metric
        run: |
          set -euo pipefail
          RULE_COUNT="$(curl -fsS http://127.0.0.1:9090/api/v1/rules | jq '[.data.groups[].rules[]] | length')"
          test "$RULE_COUNT" -gt 0

          for attempt in $(seq 1 30); do
            all_up=true
            for job in ailearn-api ailearn-worker ailearn-backup; do
              value="$(curl -fsS --get --data-urlencode "query=up{job=\"$job\"}" \
                http://127.0.0.1:9090/api/v1/query | jq -r '.data.result[0].value[1] // "0"')"
              if [ "$value" != "1" ]; then all_up=false; fi
            done
            backup_value="$(curl -fsS --get \
              --data-urlencode 'query=ailearn_db_last_successful_backup_timestamp{job="ailearn-backup"}' \
              http://127.0.0.1:9090/api/v1/query | jq -r '.data.result[0].value[1] // "0"')"
            if [ "$all_up" = true ] && awk "BEGIN { exit !($backup_value > 0) }"; then
              echo "All Alpha scrape targets and verified-backup metric are healthy"
              exit 0
            fi
            sleep 2
          done
          echo >&2 "Alpha scrape targets or verified-backup metric did not become healthy"
          curl -fsS http://127.0.0.1:9090/api/v1/targets | jq '.data.activeTargets[] | {job: .labels.job, health, lastError}' >&2
          exit 1

      - name: Capture Alpha infrastructure evidence
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/alpha-evidence"
          {
            echo "# Alpha Infrastructure Evidence"
            echo ""
            echo "## Prometheus Targets"
            curl -sf http://localhost:9090/api/v1/targets 2>/dev/null | \
              jq '.data.activeTargets[] | {job: .labels.job, health: .health}' || echo "N/A"
            echo ""
            echo "## Alert Rules"
            curl -sf http://localhost:9090/api/v1/rules 2>/dev/null | \
              jq '.data.groups[] | {name: .name, ruleCount: (.rules | length)}' || echo "N/A"
          } > "$RUNNER_TEMP/alpha-evidence/alpha-report.md"
          docker compose -f docker-compose.yml -f docker-compose.alpha.yml --profile storage \
            run --rm -v "$RUNNER_TEMP/alpha-evidence:/evidence" backup-runner \
            sh -c 'cp -R /var/lib/ailearn/manifests /evidence/'
          docker compose -f docker-compose.yml -f docker-compose.alpha.yml --profile storage \
            logs --no-color > "$RUNNER_TEMP/alpha-evidence/compose.log" 2>&1 || true

      - name: Upload Alpha infrastructure evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: alpha-infrastructure-evidence-${{ github.run_id }}
          path: ${{ runner.temp }}/alpha-evidence
          if-no-files-found: warn
          retention-days: 90

      - name: Stop Alpha infrastructure
        if: always()
        run: |
          docker compose -f docker-compose.yml -f docker-compose.alpha.yml --profile storage down --volumes --remove-orphans
