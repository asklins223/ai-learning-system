appId: com.asklins.ailearn
productName: AI Learn
copyright: Copyright © 2026 AI Learn

directories:
  output: release

files:
  - out/**/*
  # Defense in depth: production renderer builds already omit these archives.
  # Keep the package boundary explicit if an externally supplied out/ is used.
  - '!out/renderer/assets/3d{,/**/*}'
  - package.json

asar: true
compression: maximum

mac:
  category: public.app-category.education
  target:
    - dmg
    - zip
  # 伴星语音输入要用麦克风。macOS 少了这条描述，系统弹窗根本不会出现，
  # TCC 直接把 getUserMedia 判拒 —— 只放开主进程的权限闸是不够的。
  extendInfo:
    NSMicrophoneUsageDescription: AI Learn 需要用麦克风把你的话转给伴星。

win:
  target:
    - target: nsis
      arch:
        - x64

linux:
  category: Education
  target:
    - AppImage

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true

artifactName: ${productName}-${version}-${os}-${arch}.${ext}
