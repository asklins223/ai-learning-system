# electron-builder configuration for desktop packaging.
# macOS produces a .dmg/.zip, Windows an NSIS installer/portable build, and
# Linux AppImage/deb artifacts. Publishing targets the frozen GitHub release
# channel below; signing credentials remain deployment-owned secrets.
#
# The app bundles the Next.js standalone output (traced node_modules).
# The backend (Docker/API/Postgres/Worker) is managed externally by the user.

appId: com.ailearn.desktop
productName: AI Learn
copyright: Copyright © 2026 AI Learn Team

directories:
  output: release
  buildResources: build

# Only keep English and Simplified Chinese locales — removes ~55 unused
# .lproj directories (~60MB) from the Electron Framework bundle.
electronLanguages:
  - en
  - zh_CN

# afterPack hook strips locale .lproj dirs from Electron Framework
# (electronLanguages only handles app-level symlinks, not Framework).
afterPack: ./after-pack.cjs

# macOS-specific configuration.
mac:
  category: public.app-category.education
  icon: build/icon.icns
  target:
    - target: dmg
      arch:
        - arm64
    - target: zip
      arch:
        - arm64
  hardenedRuntime: true
  gatekeeperAssess: false
  # With no Apple credentials local builds skip notarization with a warning;
  # release builds must provide APPLE_API_KEY(_ID/_ISSUER), APPLE_ID +
  # APPLE_APP_SPECIFIC_PASSWORD + APPLE_TEAM_ID, or an App Store keychain
  # profile. Keeping this enabled prevents a release config from silently
  # opting out of notarization.
  notarize: true
  # P3：点按切换式半双工语音需要麦克风；usage description 在 macOS 首次授权时展示
  extendInfo:
    NSMicrophoneUsageDescription: "点按开始、再次点按结束，用于学习伴星语音输入"

# Windows hardening: NSIS is the installable artifact used by the release
# pipeline; portable is retained for smoke/rollback drills without installing
# into the user's profile.  Both are x64 until a signed arm64 Windows build is
protocols:
  # 2026-08-11：ailearn:// 深链协议（open/唤醒应用；未来可扩展路由跳转）
  - name: AI Learn
    schemes:
      - ailearn
# explicitly approved.
win:
  icon: build/icon.png
  # Development-only self-signed build: npm run dist:win:dev
  # (WIN_CSC_LINK/WIN_CSC_KEY_PASSWORD are injected by the script).
  target:
    - target: nsis
      arch:
        - x64
    - target: portable
      arch:
        - x64
  requestedExecutionLevel: asInvoker
  verifyUpdateCodeSignature: true
  # 2026-08-12：electron-updater 在 publisherName==null 时直接跳过 Authenticode
  # 校验(NsisUpdater.js:88-90)，verifyUpdateCodeSignature 形同虚设——必须显式
  # 声明证书主体。dev 自签脚本(build-win-dev-signing.ps1)固定 CN=AI Learn
  # Development，与此一致；正式发布前必须改为正式签名证书的 CN（不一致时
  # 更新校验失败 = 拒绝安装，fail-closed 而非跳过校验）。
  publisherName:
    - "AI Learn Development"

# Linux hardening: AppImage is the portable smoke artifact and deb is the
# package-manager artifact.  Transparent click-through remains disabled by
# the runtime on Linux because X11/Wayland support differs by compositor.
linux:
  icon: build/icon.png
  category: Education
  synopsis: AI Learn desktop learning companion
  target:
    - target: AppImage
      arch:
        - x64
    - target: deb
      arch:
        - x64

# Frozen updater source. electron-updater consumes latest-{platform}.yml and
# the matching artifact from the GitHub release channel below.
publish:
  provider: github
  owner: asklins223
  repo: ai-learning-system
  releaseType: release

# DMG (disk image) configuration.
dmg:
  title: "AI Learn"
  contents:
    - x: 140
      y: 200
    - x: 400
      y: 200
      type: link
      path: /Applications

# Bundle the Next.js standalone output into resources/web/.
# Standalone mode traces all imports during `next build` and includes
# only the needed node_modules files — typically 50-80MB vs 350MB+.
# The prebuild:web script copies .next/static/ and public/ into the
# standalone directory so it is fully self-contained.
extraResources:
  - from: build/icon.png
    to: icon.png
  - from: ../../apps/web/.next/standalone
    to: web/.next/standalone
    filter:
      - "**/*"
      - "!**/*.md"
      - "!**/*.map"
      - "!**/*.tsbuildinfo"
      - "!**/test/**"
      - "!**/tests/**"
      - "!**/__tests__/**"
      # sharp-libvips (17MB) — not needed: app does not use next/image
      - "!**/sharp-libvips*/**"
      - "!**/sharp-wasm32/**"
      # typescript (8.7MB) — traced via @milkdown/components→vue, but the
      # app uses @milkdown/react, not the Vue components
      - "!**/node_modules/typescript/**"
  - from: ../../THIRD_PARTY_NOTICES.md
    to: THIRD_PARTY_NOTICES.md

# Files to include in the app bundle (Electron side).
files:
  - dist/**/*
  - node_modules/**/*
  - package.json

# P6 §13：sherpa-onnx-node 是 native addon（.node + .dylib），必须从 asar
# 解包才能在 utility process 加载；模型文件（model.int8.onnx/tokens.txt）
# 刻意不打包（由 ASR_SENSEVOICE_MODEL_DIR 指向设备本地目录）。
asarUnpack:
  - "**/node_modules/sherpa-onnx-node/**"
  - "**/node_modules/sherpa-onnx-*/**"
