name: ailearn

# Production-like stack. All application containers use their `prod` image
# target, run without source bind mounts and inherit the non-root image user.
# Local hot-reload defaults live in the standalone docker-compose.dev.yml.

x-api-build: &api-build
  context: .
  dockerfile: apps/api/Dockerfile
  target: prod

x-worker-build: &worker-build
  context: .
  dockerfile: workers/ai-worker/Dockerfile
  target: prod

x-role-bootstrap-environment: &role-bootstrap-environment
  POSTGRES_HOST: postgres
  POSTGRES_USER: ${POSTGRES_USER:-ailearn}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env before starting the production stack}
  POSTGRES_DB: ${POSTGRES_DB:-ailearn}
  MIGRATOR_PASSWORD: ${MIGRATOR_PASSWORD:?Set MIGRATOR_PASSWORD in .env before starting the production stack}
  API_PASSWORD: ${API_PASSWORD:?Set API_PASSWORD in .env before starting the production stack}
  WORKER_PASSWORD: ${WORKER_PASSWORD:?Set WORKER_PASSWORD in .env before starting the production stack}

x-role-bootstrap-volumes: &role-bootstrap-volumes
  - ./infra/postgres/apply-roles.sh:/opt/ailearn/apply-roles.sh:ro
  - ./infra/postgres/roles.sql:/opt/ailearn/roles.sql:ro

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ailearn}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env before starting the production stack}
      POSTGRES_DB: ${POSTGRES_DB:-ailearn}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - ailearn_net

  # Runs on every deployment path, including existing data volumes.  The
  # first pass creates/rotates the roles and transfers legacy object ownership
  # before migrations run; the post-migration pass below grants new objects.
  #
  # One-shot (restart: "no"): `make up` waits for it to exit and then removes
  # the container via `make clean-init` so it doesn't linger in `docker ps -a`.
  role-bootstrap:
    image: postgres:16-alpine
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    environment: *role-bootstrap-environment
    volumes: *role-bootstrap-volumes
    entrypoint: ["/bin/sh", "/opt/ailearn/apply-roles.sh"]
    security_opt:
      - no-new-privileges:true
    networks:
      - ailearn_net

  # Optional object storage: `make storage`. The wrapper deliberately exits
  # when credentials are empty instead of falling back to MinIO defaults.
  minio:
    image: minio/minio:RELEASE.2024-12-18T13-15-44Z
    profiles: ["storage"]
    restart: unless-stopped
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        test -n "$${MINIO_ROOT_USER:-}" || { echo >&2 'MINIO_ROOT_USER is required'; exit 1; }
        test -n "$${MINIO_ROOT_PASSWORD:-}" || { echo >&2 'MINIO_ROOT_PASSWORD is required'; exit 1; }
        exec minio server /data --console-address ':9001'
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-}
    ports:
      - "${MINIO_BIND_ADDRESS:-127.0.0.1}:${MINIO_PORT:-9000}:9000"
      - "${MINIO_BIND_ADDRESS:-127.0.0.1}:${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - ailearn_net

  # One-shot bucket bootstrap (profile: storage).  `make storage` waits for
  # it to exit and removes the container immediately afterwards.
  minio-init:
    image: minio/mc:RELEASE.2024-11-21T17-21-54Z
    profiles: ["storage"]
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-}
      S3_BUCKET: ${S3_BUCKET:-ailearn-workspaces}
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        test -n "$${MINIO_ROOT_USER:-}" || { echo >&2 'MINIO_ROOT_USER is required'; exit 1; }
        test -n "$${MINIO_ROOT_PASSWORD:-}" || { echo >&2 'MINIO_ROOT_PASSWORD is required'; exit 1; }
        mc alias set local http://minio:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}"
        mc mb -p "local/$${S3_BUCKET}" || true
        mc anonymous set none "local/$${S3_BUCKET}"
        echo 'minio init done'
    networks:
      - ailearn_net

  # Migrations are automatic, but account seeding is intentionally separate.
  # One-shot (restart: "no"): runs on every `make up` to apply pending
  # migrations, then is auto-removed by `make clean-init`.
  migrate:
    build: *api-build
    user: node
    restart: "no"
    depends_on:
      role-bootstrap:
        condition: service_completed_successfully
    environment:
      DATABASE_URL_MIGRATOR: ${DATABASE_URL_MIGRATOR:?Set DATABASE_URL_MIGRATOR in .env before starting the production stack}
      NODE_ENV: production
    command: ["npm", "run", "db:migrate"]
    security_opt:
      - no-new-privileges:true
    networks:
      - ailearn_net

  # One-shot (restart: "no"): re-applies role grants on objects created by
  # the migrator, then is auto-removed by `make clean-init`.
  role-grants:
    image: postgres:16-alpine
    restart: "no"
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      <<: *role-bootstrap-environment
      REQUIRE_RLS_DISABLED: "true"
    volumes: *role-bootstrap-volumes
    entrypoint: ["/bin/sh", "/opt/ailearn/apply-roles.sh"]
    security_opt:
      - no-new-privileges:true
    networks:
      - ailearn_net

  # Run explicitly with `make seed-owner`. seed.ts fails closed when either
  # OWNER_EMAIL or OWNER_PASSWORD is absent and never enables demo defaults.
  # Uses `run --rm` so the container is removed immediately after seeding.
  seed-owner:
    profiles: ["seed"]
    build: *api-build
    user: node
    restart: "no"
    depends_on:
      role-grants:
        condition: service_completed_successfully
    environment:
      DATABASE_URL_API: ${DATABASE_URL_API:?Set DATABASE_URL_API in .env before starting the production stack}
      NODE_ENV: production
      OWNER_EMAIL: ${OWNER_EMAIL:-}
      OWNER_PASSWORD: ${OWNER_PASSWORD:-}
      OWNER_WORKSPACE: ${OWNER_WORKSPACE:-Personal Workspace}
    command: ["npm", "run", "db:seed"]
    security_opt:
      - no-new-privileges:true
    networks:
      - ailearn_net

  api:
    build: *api-build
    user: node
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      role-grants:
        condition: service_completed_successfully
    environment:
      DATABASE_URL_API: ${DATABASE_URL_API:?Set DATABASE_URL_API in .env before starting the production stack}
      NODE_ENV: production
      PORT: 4000
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3000}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      TRUST_PROXY: ${TRUST_PROXY:-loopback,linklocal,uniquelocal}
      AUTH_RATE_LIMIT_STORE: ${AUTH_RATE_LIMIT_STORE:-postgres}
      AUTH_RATE_LIMIT_WINDOW_MS: ${AUTH_RATE_LIMIT_WINDOW_MS:-900000}
      AUTH_RATE_LIMIT_MAX_ATTEMPTS: ${AUTH_RATE_LIMIT_MAX_ATTEMPTS:-5}
      AI_MODEL_TEST_RATE_LIMIT_WINDOW_MS: ${AI_MODEL_TEST_RATE_LIMIT_WINDOW_MS:-300000}
      AI_MODEL_TEST_RATE_LIMIT_MAX_ATTEMPTS: ${AI_MODEL_TEST_RATE_LIMIT_MAX_ATTEMPTS:-5}
      AI_MODEL_TEST_TIMEOUT_MS: ${AI_MODEL_TEST_TIMEOUT_MS:-15000}
      SCHEDULER_POLICY_VERSION: ${SCHEDULER_POLICY_VERSION:-discrete-v1}
      FSRS_SHADOW_ENABLED: ${FSRS_SHADOW_ENABLED:-false}
      CARD_GENERATION_V2_ENABLED: ${CARD_GENERATION_V2_ENABLED:-true}
      AI_ALLOW_DOCKER_DESKTOP_SYNTHETIC_DNS: ${AI_ALLOW_DOCKER_DESKTOP_SYNTHETIC_DNS:-false}
      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-true}
      AI_CREDENTIAL_ENCRYPTION_KEY: ${AI_CREDENTIAL_ENCRYPTION_KEY:-}
      # Image upload: MinIO/S3 storage endpoint
      STORAGE_ENDPOINT: ${STORAGE_ENDPOINT:-http://minio:9000}
      S3_BUCKET: ${S3_BUCKET:-ailearn-workspaces}
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-}
    ports:
      - "${API_BIND_ADDRESS:-127.0.0.1}:${API_PORT:-4000}:4000"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:4000/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 5s
      timeout: 5s
      retries: 12
    security_opt:
      - no-new-privileges:true
    networks:
      - ailearn_net

  worker:
    build: *worker-build
    user: node
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      role-grants:
        condition: service_completed_successfully
    environment:
      DATABASE_URL_WORKER: ${DATABASE_URL_WORKER:?Set DATABASE_URL_WORKER in .env before starting the production stack}
      NODE_ENV: production
      AI_PROVIDER_CARD: ${AI_PROVIDER_CARD:-mock}
      AI_CREDENTIAL_ENCRYPTION_KEY: ${AI_CREDENTIAL_ENCRYPTION_KEY:-}
      AI_ALLOW_DOCKER_DESKTOP_SYNTHETIC_DNS: ${AI_ALLOW_DOCKER_DESKTOP_SYNTHETIC_DNS:-false}
      DASHSCOPE_API_KEY: ${DASHSCOPE_API_KEY:-}
      DASHSCOPE_MODEL: ${DASHSCOPE_MODEL:-qwen-plus}
      DASHSCOPE_ENABLE_THINKING: ${DASHSCOPE_ENABLE_THINKING:-false}
      OPENAI_COMPAT_DISABLE_THINKING: ${OPENAI_COMPAT_DISABLE_THINKING:-false}
      DASHSCOPE_BASE_URL: ${DASHSCOPE_BASE_URL:-}
      API_INTERNAL_URL: http://api:4000
      AI_QUESTION_V1_ENABLED: ${AI_QUESTION_V1_ENABLED:-false}
      RUBRIC_EVALUATION_V1_ENABLED: ${RUBRIC_EVALUATION_V1_ENABLED:-false}
      CARD_REPAIR_V1_ENABLED: ${CARD_REPAIR_V1_ENABLED:-false}
      SCHEDULER_POLICY_VERSION: ${SCHEDULER_POLICY_VERSION:-discrete-v1}
      FSRS_SHADOW_ENABLED: ${FSRS_SHADOW_ENABLED:-false}
      CARD_GENERATION_V2_ENABLED: ${CARD_GENERATION_V2_ENABLED:-true}
      # Source image upload: MinIO/S3 storage for embedded images
      STORAGE_ENDPOINT: ${STORAGE_ENDPOINT:-http://minio:9000}
      S3_BUCKET: ${S3_BUCKET:-ailearn-workspaces}
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      WORKER_METRICS_PORT: ${WORKER_METRICS_PORT:-9100}
      # Handler timeouts (ms) — per job type, clamped below lease timeout (120s)
      WORKER_MODEL_TIMEOUT_MS: ${WORKER_MODEL_TIMEOUT_MS:-}
      WORKER_PROVIDER_TIMEOUT_MS: ${WORKER_PROVIDER_TIMEOUT_MS:-75000}
      WORKER_TIMEOUT_GENERATE_CARD_MS: ${WORKER_TIMEOUT_GENERATE_CARD_MS:-}
      WORKER_TIMEOUT_EVALUATE_VALIDATION_MS: ${WORKER_TIMEOUT_EVALUATE_VALIDATION_MS:-}
      WORKER_TIMEOUT_ALIGN_EVIDENCE_MS: ${WORKER_TIMEOUT_ALIGN_EVIDENCE_MS:-}
      WORKER_TIMEOUT_PARSE_SOURCE_MS: ${WORKER_TIMEOUT_PARSE_SOURCE_MS:-}
      # v2 学习卡流水线各阶段的 handler/provider 超时调优入口(缺省用内置值)
      WORKER_TIMEOUT_MAP_CARD_GENERATION_MS: ${WORKER_TIMEOUT_MAP_CARD_GENERATION_MS:-}
      WORKER_TIMEOUT_ANALYZE_CARD_IMAGE_MS: ${WORKER_TIMEOUT_ANALYZE_CARD_IMAGE_MS:-}
      WORKER_PROVIDER_TIMEOUT_MAP_CARD_GENERATION_MS: ${WORKER_PROVIDER_TIMEOUT_MAP_CARD_GENERATION_MS:-}
      WORKER_PROVIDER_TIMEOUT_ANALYZE_CARD_IMAGE_MS: ${WORKER_PROVIDER_TIMEOUT_ANALYZE_CARD_IMAGE_MS:-}
    ports:
      - "${WORKER_METRICS_BIND_ADDRESS:-127.0.0.1}:${WORKER_METRICS_PORT:-9100}:9100"
    security_opt:
      - no-new-privileges:true
    networks:
      - ailearn_net

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      target: prod
      args:
        INTERNAL_API_URL: http://api:4000
        NEXT_PUBLIC_QUESTION_FIRST_UI_ENABLED: ${NEXT_PUBLIC_QUESTION_FIRST_UI_ENABLED:-false}
        NEXT_PUBLIC_AI_QUESTION_V1_ENABLED: ${NEXT_PUBLIC_AI_QUESTION_V1_ENABLED:-false}
        NEXT_PUBLIC_RUBRIC_EVALUATION_V1_ENABLED: ${NEXT_PUBLIC_RUBRIC_EVALUATION_V1_ENABLED:-false}
        NEXT_PUBLIC_CARD_GENERATION_V2_ENABLED: ${NEXT_PUBLIC_CARD_GENERATION_V2_ENABLED:-true}
    user: node
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      NODE_ENV: production
      INTERNAL_API_URL: http://api:4000
    ports:
      - "${WEB_BIND_ADDRESS:-0.0.0.0}:${WEB_PORT:-3000}:3000"
    security_opt:
      - no-new-privileges:true
    networks:
      - ailearn_net

volumes:
  postgres_data:
  minio_data:

networks:
  ailearn_net:
    driver: bridge
